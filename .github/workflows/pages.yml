name: Publish web game
on:
  push:
    branches: [main]
    paths: ['squareup/**', 'majlis-android/app/src/main/assets/photos/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.dep.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build
        working-directory: squareup
        run: |
          python3 build.py
          cp manifest.json icon-192.png icon-512.png dist/
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: squareup/dist }
      - id: dep
        uses: actions/deploy-pages@v4
