name: iOS TestFlight
# Builds majlis-ios on a GitHub Mac and uploads it to TestFlight, signed the same way as GameVault
# (manual signing with the team's Apple Distribution certificate, upload with an Apple ID app-specific password).
# Repository secrets, same names as in GameVault:
#   APPLE_TEAM_ID, APPLE_DISTRIBUTION_P12_BASE64, APPLE_DISTRIBUTION_P12_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD
# plus one for this app:
#   MAJLIS_PROVISIONING_PROFILE_BASE64   base64 of the "Majlis App Store" profile for com.ahmedalqamzi.majlis
# For the upload, an App Store Connect API key is used when set (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8),
# otherwise the Apple ID and app-specific password.
# Without them the job only checks that the app compiles.
on:
  push:
    branches: [main]
    paths: ['majlis-ios/**', '.github/workflows/ios-testflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: majlis-testflight, cancel-in-progress: false }
jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SIGN: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 != '' && secrets.MAJLIS_PROVISIONING_PROFILE_BASE64 != '' && (secrets.ASC_KEY_ID != '' || secrets.APPLE_ID != '') }}
    defaults:
      run:
        working-directory: majlis-ios
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Check that the app compiles (no Apple secrets yet)
        if: env.SIGN != 'true'
        run: |
          echo "::warning::Apple signing secrets are not set, so the app is built but not uploaded."
          xcodebuild -project Majlis.xcodeproj -scheme Majlis -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -30
          test "${PIPESTATUS[0]}" -eq 0
      - name: Install the distribution certificate and profile
        if: env.SIGN == 'true'
        env:
          P12: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.MAJLIS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          kc="$RUNNER_TEMP/majlis.keychain-db"; kcpw="$(openssl rand -hex 32)"
          printf '%s' "$P12" | base64 -D > "$RUNNER_TEMP/dist.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE" | base64 -D > "$HOME/Library/MobileDevice/Provisioning Profiles/majlis.mobileprovision"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc"
          security list-keychains -d user -s "$kc"
          security find-identity -v -p codesigning "$kc"
          rm "$RUNNER_TEMP/dist.p12"
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(( $(date -u +%s) - 1790000000 ))" >> "$GITHUB_ENV"
      - name: Archive
        if: env.SIGN == 'true'
        env: { TEAM: '${{ secrets.APPLE_TEAM_ID }}' }
        run: |
          set -o pipefail
          xcodebuild -project Majlis.xcodeproj -scheme Majlis -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/Majlis.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER='Majlis App Store' CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tail -40
      - name: Export the IPA
        if: env.SIGN == 'true'
        env: { TEAM: '${{ secrets.APPLE_TEAM_ID }}' }
        run: |
          set -o pipefail
          sed "s/TEAM_ID/$TEAM/" ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/Majlis.xcarchive -exportPath build/TestFlight \
            -exportOptionsPlist build/ExportOptions.plist | tail -30
      - name: Upload to TestFlight
        if: env.SIGN == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          ipa="$(find build/TestFlight -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa" || { echo "::error::Xcode did not export an IPA."; exit 1; }
          if [ -n "$ASC_KEY_ID" ]; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
            auth=(--apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID")
          else
            auth=(--username "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD")
          fi
          xcrun altool --validate-app --file "$ipa" --type ios "${auth[@]}"
          xcrun altool --upload-app --file "$ipa" --type ios "${auth[@]}"
          echo "Uploaded build $BUILD_NUMBER to TestFlight."
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
