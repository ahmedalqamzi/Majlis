<title>Square Up</title>
<meta name="theme-color" content="#0B2233">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Square Up">
<link rel="manifest" href="__MANIFEST__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: game-show board. Category cards in a wrapping grid, score rail pinned to the bottom, question takes over the screen. */
:root{
  --night:#0B2233; --deep:#123349; --panel:#18405A; --line:#2A5874;
  --sand:#F1B94A; --coral:#F26A5E; --ink:#F6F1E7; --mist:#A9C3D3;
  --t1:#F1B94A; --t2:#F26A5E; --t3:#4FD1C5; --t4:#B79CFF;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;margin:0;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 20% -10%,#1d4a66 0,transparent 55%),radial-gradient(circle at 110% 110%,#3a2440 0,transparent 50%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.screen{min-height:100%;padding-inline:16px;padding-block:20px 120px;max-width:1200px;margin:0 auto;box-sizing:border-box}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.5px;margin:0;text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:14px;font-weight:800;font-size:17px;transition:transform .12s, filter .12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--sand);color:#2A1A00;box-shadow:0 4px 0 #b9862a}
.btn-ghost{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 #0d2a3c}
.btn-danger{background:transparent;color:var(--coral);border:2px solid var(--coral)}
.btn[disabled]{opacity:.4;pointer-events:none}
.label{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mist);font-weight:800}

/* Home */
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;min-height:calc(100% - 140px)}
.logo{display:grid;grid-template-columns:repeat(2,64px);gap:8px;transform:rotate(-6deg)}
.logo span{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:34px;color:#1b1206}
.logo span:nth-child(1){background:var(--t1)}.logo span:nth-child(2){background:var(--t2)}.logo span:nth-child(3){background:var(--t3)}.logo span:nth-child(4){background:var(--t4)}
.home h1{font-size:clamp(48px,12vw,84px);line-height:.95}
.home p{color:var(--mist);max-width:34ch;margin:0;line-height:1.5}
.home .actions{display:flex;flex-direction:column;gap:14px;width:min(320px,100%)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:min(720px,100%);text-align:left}
.how div{background:rgba(24,64,90,.6);border-radius:14px;padding:14px}
.how b{font-family:var(--display);font-weight:400;color:var(--sand);font-size:22px;display:block}
.how small{color:var(--mist);line-height:1.4;display:block;margin-top:4px}

/* Setup */
.setup{display:flex;flex-direction:column;gap:28px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar h2{font-size:30px}
.section{display:flex;flex-direction:column;gap:12px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.team-in{display:flex;align-items:center;gap:10px;background:var(--deep);border-radius:14px;padding:10px 12px;border:2px solid var(--line)}
.team-in i{width:14px;height:14px;border-radius:50%;flex:none}
.team-in input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:600 17px var(--body);padding:6px 0}
.team-in button{color:var(--mist);font-size:22px;line-height:1;padding:4px 8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:10px 16px;border-radius:12px;background:var(--deep);border:2px solid var(--line);font-weight:800}
.seg button.on{background:var(--sand);color:#2A1A00;border-color:var(--sand)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:16px;background:var(--deep);border:2px solid var(--line);text-align:left;min-height:104px;transition:transform .12s,border-color .12s}
.cat svg{width:34px;height:34px;color:var(--mist)}
.cat span{font-weight:800;font-size:16px;line-height:1.2}
.cat.on{border-color:var(--sand);background:#24465c}
.cat.on svg{color:var(--sand)}
.cat.on::after{content:attr(data-n);position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--sand);color:#2A1A00;display:grid;place-items:center;font-weight:800;font-size:14px}
.counter{font-weight:800;color:var(--sand)}
.startbar{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--night) 30%);display:flex;justify-content:center}
.startbar .btn{width:min(420px,100%)}

/* Board */
.turn{display:flex;align-items:center;gap:10px;font-weight:800}
.turn i{width:12px;height:12px;border-radius:50%}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:16px}
.bcat{background:var(--deep);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--line)}
.bcat header{display:flex;align-items:center;gap:10px}
.bcat header svg{width:26px;height:26px;color:var(--sand);flex:none}
.bcat header h3{font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{font-family:var(--display);font-size:24px;padding:12px 0;border-radius:12px;background:var(--panel);color:var(--sand);box-shadow:0 4px 0 #0d2a3c;font-variant-numeric:tabular-nums;transition:transform .12s}
.tile:active{transform:translateY(2px);box-shadow:0 2px 0 #0d2a3c}
.tile.done{box-shadow:none;color:rgba(11,34,51,.75);pointer-events:none;font-size:14px;font-family:var(--body);font-weight:800}
.tile.none{background:transparent;border:2px dashed var(--line);color:var(--line)}
.scorerail{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(11,34,51,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center;z-index:5}
.chip{flex:1;max-width:240px;min-width:0;border-radius:14px;padding:8px 10px;background:var(--deep);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.chip.cur{border-color:var(--c)}
.chip.cur::before{content:"TURN";position:absolute;top:-9px;background:var(--c);color:#1b1206;font-size:10px;font-weight:800;letter-spacing:1px;padding:1px 6px;border-radius:6px}
.chip .nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--c)}
.chip .sc{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.chip .adj{display:flex;gap:6px}
.chip .adj button{font-size:12px;font-weight:800;color:var(--mist);padding:2px 8px;border-radius:8px;background:var(--panel)}
.helps{display:flex;gap:4px}
.helps b{width:7px;height:7px;border-radius:50%;background:var(--c)}
.helps b.used{background:var(--line)}

/* Question */
.q{position:fixed;inset:0;z-index:20;background:var(--night);overflow:auto;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.q-inner{max-width:860px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px;flex:1}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.q-meta{display:flex;align-items:center;gap:10px}
.q-meta svg{width:28px;height:28px;color:var(--sand)}
.pts{font-family:var(--display);font-size:28px;color:var(--sand);font-variant-numeric:tabular-nums}
.pts.x2{color:var(--coral)}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.ring.low b{color:var(--coral)}
.q-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;padding-block:10px}
.q-text{font-size:clamp(24px,5vw,40px);font-weight:800;line-height:1.25;text-wrap:balance}
.q-ans{background:var(--sand);color:#2A1A00;border-radius:18px;padding:18px 20px;animation:pop .35s ease}
.q-ans small{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;opacity:.7}
.q-ans div{font-family:var(--display);font-size:clamp(26px,6vw,44px);line-height:1.1;margin-top:4px}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.q-for{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--mist)}
.q-for b{color:var(--c)}
.aids{display:flex;gap:8px;flex-wrap:wrap}
.aid{padding:10px 14px;border-radius:12px;background:var(--deep);border:2px solid var(--line);font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.aid small{font-weight:600;color:var(--mist);font-size:12px}
.aid.active{border-color:var(--coral);background:#3a2533}
.aid[disabled]{opacity:.35;pointer-events:none}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.who button{padding:16px 12px;border-radius:14px;font-weight:800;font-size:17px;background:var(--c);color:#1b1206;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.who button.nobody{background:var(--panel);color:var(--ink)}
.timeup{color:var(--coral);font-weight:800;text-align:center}

/* End */
.end{display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center;padding-top:30px}
.end h1{font-size:clamp(42px,10vw,72px);color:var(--sand)}
.rank{width:min(460px,100%);display:flex;flex-direction:column;gap:10px}
.rank div{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:14px;background:var(--deep);border-left:6px solid var(--c);font-weight:800}
.rank div span:last-child{font-family:var(--display);font-size:26px;font-weight:400}
.rank div.first{background:#2a4a3f}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.modal{position:fixed;inset:0;background:rgba(5,15,22,.8);z-index:40;display:grid;place-items:center;padding:16px}
.modal>div{background:var(--deep);border-radius:18px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:16px;border:2px solid var(--line)}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.tile{font-size:20px;padding:11px 0}.chip .sc{font-size:22px}}
</style>

<div id="app"></div>

<script>
const BANK = __DATA__;
const COLORS=["var(--t1)","var(--t2)","var(--t3)","var(--t4)"];
const ICONS={
 cars:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l2-6a2 2 0 0 1 2-1.4h10A2 2 0 0 1 19 9l2 6v3h-2.5M5.5 18H3v-3h18"/><circle cx="7.5" cy="17.5" r="2"/><circle cx="16.5" cy="17.5" r="2"/><path d="M9.5 18h5"/></svg>',
 videogames:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10a5 5 0 0 1 4.8 6.4l-.9 3A2.5 2.5 0 0 1 16.6 17L15 15H9l-1.6 2a2.5 2.5 0 0 1-4.3-.6l-.9-3A5 5 0 0 1 7 7z"/><path d="M7.5 10v3M6 11.5h3"/><circle cx="16" cy="10.5" r=".8" fill="currentColor"/><circle cx="17.5" cy="12.5" r=".8" fill="currentColor"/></svg>',
 soccer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.2 2.3-1.2 3.7h-4l-1.2-3.7zM12 7.5V3.2M15.2 9.8l4.3-1.4M14 13.5l2.6 3.6M10 13.5l-2.6 3.6M8.8 9.8L4.5 8.4"/></svg>',
 anime:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.4 6.1 6.6.4-5.1 4.2 1.7 6.4L12 16l-5.6 3.6 1.7-6.4L3 9l6.6-.4z"/></svg>',
 onepiece:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v14M8 10h8M5 14a7 7 0 0 0 14 0M5 14l-1.5 1.5M19 14l1.5 1.5"/></svg>',
 movies:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="10" width="18" height="11" rx="1.5"/><path d="M3 10l1.6-5 16 3.8L19.9 10M8.5 6.2L10 9.6M13.5 7.4l1.6 3"/></svg>',
 uaehistory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M12 9c-2-3-5-4-8-3M12 9c2-3 5-4 8-3M12 9c-1-3-1-5 1-6M12 9c-3-1-6 1-7 4M12 9c3-1 6 1 7 4"/><path d="M8 21h8"/></svg>',
 geography:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
 science:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1.6" fill="currentColor"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg>',
 food:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v7a2 2 0 0 0 4 0V3M8 10v11M17 21V3c-2.5 1-3.5 4-3.5 7.5S15 14 17 14"/></svg>',
 brands:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
 general:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>'
};
const AIDS=[{id:"double",name:"Double",desc:"x2 if you get it"},{id:"time",name:"+30 sec",desc:"More thinking time"},{id:"two",name:"Two Guesses",desc:"Say two answers"}];
const TIERS=[200,200,400,400,600,600];

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let setup=store.get("su_setup",{teams:["Team Falcon","Team Dhow"],cats:[],timer:60});
let game=store.get("su_game",null);
let view=game&&!game.over?"board":"home";
let Q=null, tick=null, actx=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{store.set("su_game",game);store.set("su_setup",setup)};

function beep(f=880,d=.12){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type="triangle";g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}

function render(){
  const app=$("#app");
  if(view==="home") app.innerHTML=homeHTML();
  else if(view==="setup") app.innerHTML=setupHTML();
  else if(view==="board") app.innerHTML=boardHTML();
  else if(view==="end") app.innerHTML=endHTML();
  window.scrollTo(0,0);
}

function homeHTML(){
  const canResume=game&&!game.over;
  return `<div class="screen"><div class="home">
   <div class="logo"><span>S</span><span>Q</span><span>U</span><span>P</span></div>
   <h1>Square Up</h1>
   <p>The team trivia showdown for majlis nights. Pick six categories, take turns, and go for the big 600s.</p>
   <div class="actions">
     ${canResume?`<button class="btn btn-primary" onclick="go('board')">Resume game</button>`:""}
     <button class="btn ${canResume?"btn-ghost":"btn-primary"}" onclick="go('setup')">New game</button>
   </div>
   <div class="how">
     <div><b>2 to 4 teams</b><small>Name your teams and pass the phone to the host.</small></div>
     <div><b>6 categories</b><small>Choose from 12. Each has two 200s, 400s and 600s.</small></div>
     <div><b>3 helpers</b><small>Each team gets Double, +30 sec and Two Guesses once per game.</small></div>
     <div><b>Steal</b><small>Wrong answer? Any team can take the points.</small></div>
   </div>
  </div></div>`;
}

function setupHTML(){
  const n=setup.cats.length;
  return `<div class="screen setup">
   <div class="topbar"><button class="btn btn-ghost" onclick="go('home')" aria-label="Back">Back</button><h2>New game</h2><span style="width:72px"></span></div>
   <div class="section"><span class="label">Teams</span>
    <div class="teams">${setup.teams.map((t,i)=>`<label class="team-in" style="border-color:${COLORS[i]}"><i style="background:${COLORS[i]}"></i><input id="team${i}" value="${esc(t)}" maxlength="18" oninput="setup.teams[${i}]=this.value;store.set('su_setup',setup)" aria-label="Team ${i+1} name">${setup.teams.length>2?`<button onclick="delTeam(${i})" aria-label="Remove team">&times;</button>`:""}</label>`).join("")}</div>
    ${setup.teams.length<4?`<div><button class="btn btn-ghost" onclick="addTeam()">Add team</button></div>`:""}
   </div>
   <div class="section"><span class="label">Answer timer</span>
    <div class="seg">${[30,45,60,90].map(s=>`<button class="${setup.timer===s?"on":""}" onclick="setup.timer=${s};render()">${s} sec</button>`).join("")}</div>
   </div>
   <div class="section"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><span class="label">Categories</span><span class="counter">${n} of 6 picked</span></div>
    <div class="cats">${BANK.map(c=>{const idx=setup.cats.indexOf(c.id);return `<button class="cat ${idx>-1?"on":""}" data-n="${idx+1}" onclick="toggleCat('${c.id}')">${ICONS[c.id]||""}<span>${esc(c.name)}</span></button>`}).join("")}</div>
    <div><button class="btn btn-ghost" onclick="randomCats()">Surprise me</button></div>
   </div>
   <div class="startbar"><button class="btn btn-primary" ${n===6?"":"disabled"} onclick="startGame()">${n===6?"Start game":`Pick ${6-n} more`}</button></div>
  </div>`;
}
function addTeam(){const names=["Team Oryx","Team Pearl"];setup.teams.push(names[setup.teams.length-2]||"Team");render()}
function delTeam(i){setup.teams.splice(i,1);render()}
function toggleCat(id){const i=setup.cats.indexOf(id);if(i>-1)setup.cats.splice(i,1);else if(setup.cats.length<6)setup.cats.push(id);render()}
function randomCats(){setup.cats=BANK.map(c=>c.id).sort(()=>Math.random()-.5).slice(0,6);render()}

function startGame(){
  const used=store.get("su_used",{});
  const cats=setup.cats.map(id=>{
    const c=BANK.find(b=>b.id===id);
    used[id]=used[id]||[];
    const tiles=[];
    [200,400,600].forEach(p=>{
      let pool=c.questions.map((q,i)=>({q,i})).filter(o=>o.q.p===p&&!used[id].includes(o.i));
      if(pool.length<2){used[id]=used[id].filter(i=>c.questions[i].p!==p);pool=c.questions.map((q,i)=>({q,i})).filter(o=>o.q.p===p)}
      pool.sort(()=>Math.random()-.5).slice(0,2).forEach(o=>{used[id].push(o.i);tiles.push({p,q:o.q.q,a:o.q.a,by:null,done:false})});
    });
    return {id,name:c.name,tiles};
  });
  store.set("su_used",used);
  game={teams:setup.teams.map((n,i)=>({name:n.trim()||`Team ${i+1}`,score:0,aids:{double:false,time:false,two:false}})),cats,turn:0,timer:setup.timer,over:false};
  save();go("board");
}

function boardHTML(){
  const t=game.teams[game.turn];
  return `<div class="screen">
   <div class="topbar"><button class="btn btn-ghost" onclick="go('home')">Menu</button>
    <div class="turn"><i style="background:${COLORS[game.turn]}"></i>${esc(t.name)} to pick</div>
    <button class="btn btn-danger" onclick="confirmEnd()">End</button></div>
   <div class="board">${game.cats.map((c,ci)=>`<section class="bcat"><header>${ICONS[c.id]||""}<h3>${esc(c.name)}</h3></header>
     <div class="tiles">${c.tiles.map((x,ti)=>x.done?`<div class="tile done ${x.by===null?"none":""}" style="${x.by!==null?`background:${COLORS[x.by]}`:""};text-align:center;display:grid;place-items:center">${x.by!==null?esc(game.teams[x.by].name.slice(0,10)):"Missed"}</div>`:`<button class="tile" onclick="openQ(${ci},${ti})" aria-label="${esc(c.name)} for ${x.p}">${x.p}</button>`).join("")}</div></section>`).join("")}</div>
   ${railHTML()}
  </div>`;
}
function railHTML(){
  return `<div class="scorerail">${game.teams.map((t,i)=>`<div class="chip ${i===game.turn?"cur":""}" style="--c:${COLORS[i]}"><span class="nm">${esc(t.name)}</span><span class="sc">${t.score}</span>
   <div class="helps" aria-label="Helpers left">${AIDS.map(a=>`<b class="${t.aids[a.id]?"used":""}"></b>`).join("")}</div>
   <div class="adj"><button onclick="adj(${i},-100)" aria-label="Minus 100">-100</button><button onclick="adj(${i},100)" aria-label="Plus 100">+100</button></div></div>`).join("")}</div>`;
}
function adj(i,v){game.teams[i].score+=v;save();render()}

function openQ(ci,ti){
  const x=game.cats[ci].tiles[ti];
  Q={ci,ti,left:game.timer,revealed:false,double:false,two:false,team:game.turn};
  const el=document.createElement("div");el.className="q";el.id="qv";document.body.appendChild(el);
  drawQ();startTick();beep(660,.08);
}
function drawQ(){
  const c=game.cats[Q.ci],x=c.tiles[Q.ti],t=game.teams[Q.team];
  const R=32,C=2*Math.PI*R,frac=Math.max(0,Q.left)/Q.total();
  $("#qv").innerHTML=`<div class="q-inner">
   <div class="q-head"><div class="q-meta">${ICONS[c.id]||""}<div><div class="label">${esc(c.name)}</div><div class="pts ${Q.double?"x2":""}">${Q.double?x.p*2+" pts (x2)":x.p+" pts"}</div></div></div>
    <div class="ring ${Q.left<=10?"low":""}" aria-label="Seconds left"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="${R}" stroke="var(--panel)" stroke-width="7" fill="none"/><circle id="arc" cx="38" cy="38" r="${R}" stroke="${Q.left<=10?"var(--coral)":"var(--sand)"}" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg><b id="secs">${Math.max(0,Q.left)}</b></div></div>
   <div class="q-for" style="--c:${COLORS[Q.team]}">Answering: <b>${esc(t.name)}</b>${Q.two?" &middot; two guesses allowed":""}</div>
   <div class="q-body"><div class="q-text">${esc(x.q)}</div>
    ${Q.revealed?`<div class="q-ans"><small>Answer</small><div>${esc(x.a)}</div></div>`:""}
    ${!Q.revealed&&Q.left<=0?`<div class="timeup">Time is up. Other teams can steal.</div>`:""}
   </div>
   ${!Q.revealed?`<div class="aids">${AIDS.map(a=>`<button class="aid ${(a.id==="double"&&Q.double)||(a.id==="two"&&Q.two)?"active":""}" ${t.aids[a.id]?"disabled":""} onclick="useAid('${a.id}')">${a.name}<small>${t.aids[a.id]?"Used":a.desc}</small></button>`).join("")}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" style="flex:1" onclick="reveal()">Show answer</button><button class="btn btn-ghost" onclick="closeQ(false)">Back</button></div>`
   :`<div><div class="label" style="margin-bottom:10px">Who got it right?</div><div class="who">${game.teams.map((tm,i)=>`<button style="--c:${COLORS[i]}" onclick="award(${i})">${esc(tm.name)}</button>`).join("")}<button class="nobody" onclick="award(null)">No one</button></div></div>`}
  </div>`;
}
Q_total=function(){};
function startTick(){clearInterval(tick);tick=setInterval(()=>{if(!Q||Q.revealed){clearInterval(tick);return}Q.left--;if(Q.left<=5&&Q.left>0)beep(990,.07);if(Q.left===0){beep(220,.5);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}drawQ();clearInterval(tick);return}
  const R=32,C=2*Math.PI*R,arc=$("#arc"),s=$("#secs");if(arc){arc.setAttribute("stroke-dashoffset",C*(1-Q.left/Q.total()));if(Q.left<=10){arc.setAttribute("stroke","var(--coral)");$(".ring").classList.add("low")}}if(s)s.textContent=Q.left},1000)}
function useAid(id){
  const t=game.teams[Q.team];if(t.aids[id])return;t.aids[id]=true;
  if(id==="double")Q.double=true;
  if(id==="two")Q.two=true;
  if(id==="time"){Q.extra=(Q.extra||0)+30;const wasOut=Q.left<=0;Q.left+=30;if(wasOut)startTick()}
  save();drawQ();beep(1200,.1);
}
function reveal(){Q.revealed=true;clearInterval(tick);drawQ();beep(520,.15)}
function award(i){
  const x=game.cats[Q.ci].tiles[Q.ti];
  if(i!==null){const pts=(Q.double&&i===Q.team)?x.p*2:x.p;game.teams[i].score+=pts;beep(1320,.2)}
  x.done=true;x.by=i;
  game.turn=(game.turn+1)%game.teams.length;
  closeQ(true);
  if(game.cats.every(c=>c.tiles.every(t=>t.done))){game.over=true;save();go("end")}
}
function closeQ(saveIt){clearInterval(tick);const el=$("#qv");if(el)el.remove();Q=null;if(saveIt)save();render()}

function confirmEnd(){
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div><h3 style="font-size:24px">End this game?</h3><p style="margin:0;color:var(--mist)">Scores so far decide the winner.</p><div class="row"><button class="btn btn-ghost" id="mNo">Keep playing</button><button class="btn btn-primary" id="mYes">End game</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("#mNo").onclick=()=>m.remove();
  m.querySelector("#mYes").onclick=()=>{m.remove();game.over=true;save();go("end")};
}

function endHTML(){
  const order=game.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
  const tie=order.length>1&&order[0].score===order[1].score;
  setTimeout(confetti,50);
  return `<div class="screen end">
   <span class="label">Final scores</span>
   <h1>${tie?"It's a tie!":esc(order[0].name)+" wins!"}</h1>
   <div class="rank">${order.map((t,k)=>`<div class="${k===0&&!tie?"first":""}" style="--c:${COLORS[t.i]}"><span>${k+1}. ${esc(t.name)}</span><span>${t.score}</span></div>`).join("")}</div>
   <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="btn btn-primary" onclick="rematch()">Rematch, new questions</button><button class="btn btn-ghost" onclick="go('setup')">Change setup</button></div>
  </div>`;
}
function rematch(){startGame()}
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const box=document.createElement("div");box.className="confetti";const cols=["#F1B94A","#F26A5E","#4FD1C5","#B79CFF","#F6F1E7"];for(let k=0;k<90;k++){const i=document.createElement("i");i.style.left=Math.random()*100+"%";i.style.background=cols[k%5];i.style.animationDuration=(2+Math.random()*2.5)+"s";i.style.animationDelay=Math.random()*.8+"s";box.appendChild(i)}document.body.appendChild(box);setTimeout(()=>box.remove(),5000)}

function go(v){view=v;render()}
render();
</script>
