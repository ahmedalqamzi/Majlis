<title>Majlis</title>
<meta name="theme-color" content="#F3F4F8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Majlis">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Reem+Kufi:wght@600;700&family=Readex+Pro:wght@400;500;700&display=swap">
<style>
/* Layout: clean game-show board. Category cards with a 200/400/600 column on each side, score rail at the bottom, full-screen questions. Four skins share one token set. */
:root{
  --bg:#F3F4F8;--s1:#FFFFFF;--s2:#EEF0F6;--s3:#E2E6F0;--line:#D9DEEA;--ink:#12141C;--muted:#5E6475;
  --pri:#2F5BFF;--pri-ink:#FFFFFF;--acc:#FF7A1A;--acc-ink:#1C0D00;--shadow:0 6px 18px rgba(20,30,60,.10);--press:rgba(20,30,60,.18);--scrim:rgba(12,16,30,.55);
  --t1:#2F5BFF;--t2:#F0482A;--t3:#12A862;--t4:#9B4DFF;--on-team:#FFFFFF;--good:#12A862;--bad:#E5383B;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Readex Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-skin="midnight"]{--bg:#0D0F14;--s1:#161922;--s2:#1E222D;--s3:#2A2F3C;--line:#2F3543;--ink:#F1F3F8;--muted:#98A0B3;--pri:#5B7CFF;--pri-ink:#FFFFFF;--acc:#FFB224;--acc-ink:#1C1200;--shadow:0 6px 18px rgba(0,0,0,.35);--press:rgba(0,0,0,.5);--scrim:rgba(0,0,0,.65);--t1:#6B8AFF;--t2:#FF6B57;--t3:#2ED18A;--t4:#C29BFF;--on-team:#0B0D12;color-scheme:dark}
:root[data-skin="gulf"]{--bg:#04262B;--s1:#093840;--s2:#0E4650;--s3:#155663;--line:#1F6573;--ink:#EAF7F5;--muted:#9CC7C2;--pri:#FFC857;--pri-ink:#2A1D00;--acc:#FF8A73;--acc-ink:#2A0A04;--shadow:0 6px 18px rgba(0,0,0,.3);--press:rgba(0,0,0,.45);--scrim:rgba(0,10,12,.7);--t1:#FFC857;--t2:#FF8A73;--t3:#7BE0C3;--t4:#D9CCFF;--on-team:#04262B;color-scheme:dark}
:root[data-skin="sadu"]{--bg:#1A0F0D;--s1:#26160F;--s2:#342017;--s3:#45291D;--line:#563526;--ink:#F5ECDD;--muted:#C2A992;--pri:#C8352E;--pri-ink:#F5ECDD;--acc:#E6A23C;--acc-ink:#2B1606;--shadow:0 6px 18px rgba(0,0,0,.35);--press:rgba(0,0,0,.5);--scrim:rgba(10,5,4,.75);--t1:#E6A23C;--t2:#E2544B;--t3:#3FB07B;--t4:#F5ECDD;--on-team:#22120A;--display:"Reem Kufi","Trebuchet MS",sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;margin:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance}
.screen{min-height:100%;padding-inline:16px;padding-block:0 140px;max-width:1180px;margin:0 auto;box-sizing:border-box}
.band{height:6px;background:linear-gradient(90deg,var(--t1) 0 25%,var(--t2) 25% 50%,var(--t3) 50% 75%,var(--t4) 75%)}
:root[data-skin="sadu"] .band{height:12px;background-color:var(--ink);background-image:linear-gradient(135deg,var(--pri) 25%,transparent 25%),linear-gradient(225deg,var(--pri) 25%,transparent 25%),linear-gradient(315deg,var(--bg) 25%,transparent 25%),linear-gradient(45deg,var(--bg) 25%,transparent 25%);background-size:12px 12px;background-position:-6px 0,-6px 0,0 0,0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:14px;font-weight:700;font-size:16px;transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn-pri{background:var(--pri);color:var(--pri-ink);box-shadow:0 4px 0 var(--press)}
.btn-acc{background:var(--acc);color:var(--acc-ink);box-shadow:0 4px 0 var(--press)}
.btn-soft{background:var(--s1);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 var(--press)}
.btn-line{color:var(--muted);border:1px solid var(--line);padding:10px 14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.label{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.top h2{font-size:26px}
.ico{width:22px;height:22px;flex:none}
.skins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.skins button{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:14px;font-weight:500}
.skins button.on{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.skins i{width:16px;height:16px;border-radius:50%;display:block}

/* Home */
.home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-top:6vh}
.mark{font-family:var(--display);font-weight:800;font-size:clamp(60px,16vw,112px);line-height:.9;letter-spacing:-1px}
.mark span{color:var(--pri)}
.tag{color:var(--muted);max-width:38ch;line-height:1.55;margin:0}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stats div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 16px;text-align:left;box-shadow:var(--shadow)}
.stats b{display:block;font-family:var(--display);font-size:26px;color:var(--pri);font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:13px}
.acts{display:flex;flex-direction:column;gap:14px;width:min(340px,100%)}

/* Setup */
.setup{display:flex;flex-direction:column;gap:26px}
.sec{display:flex;flex-direction:column;gap:12px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.team-in{display:flex;align-items:center;gap:10px;background:var(--s1);border-radius:14px;padding:8px 12px;border:1px solid var(--line);border-left:6px solid var(--c)}
.team-in input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:500 17px var(--body);padding:8px 0}
.team-in button{color:var(--muted);font-size:24px;line-height:1;padding:4px 8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:10px 16px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-weight:700}
.seg button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.search{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:400 16px var(--body);padding:10px 0}
.picked{display:flex;gap:8px;flex-wrap:wrap}
.picked button{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 8px;border-radius:12px;background:var(--s1);border:1px solid var(--pri);font-weight:500;font-size:14px}
.picked button .x{color:var(--muted);font-size:18px;line-height:1}
.grp{display:flex;flex-direction:column;gap:10px}
.grp h3{font-size:19px;display:flex;align-items:center;gap:8px}
.grp h3 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.cat{position:relative;display:flex;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:14px;min-height:62px;box-shadow:var(--shadow)}
.cat .main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;padding:10px 34px 10px 10px}
.badge{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--gc);color:#fff}
.badge svg{width:24px;height:24px}
.cat .nm{font-weight:500;font-size:14.5px;line-height:1.2;min-width:0}
.cat .nm small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.cat.on{border-color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.cat.on::after{content:attr(data-n);position:absolute;top:-8px;left:-6px;width:24px;height:24px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.cat.ex{opacity:.62}
.cat.ex .nm small{color:var(--bad)}
.exbtn{position:absolute;top:50%;right:4px;transform:translateY(-50%);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.exbtn svg{width:19px;height:19px}
.cat.ex .exbtn{color:var(--bad)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);display:flex;justify-content:center;z-index:5}
.dock .btn{width:min(420px,100%)}

/* Abilities draft */
.draft{display:flex;flex-direction:column;gap:22px}
.dteam{background:var(--s1);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dteam header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dteam h3{font-size:20px}
.abil{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ab{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--s2)}
.ab .ai{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--s3);color:var(--ink)}
.ab .ai svg{width:20px;height:20px}
.ab b{display:block;font-size:14.5px}
.ab small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.ab.on{border-color:var(--c);background:var(--s1);box-shadow:inset 0 0 0 2px var(--c)}
.ab.on .ai{background:var(--c);color:var(--on-team)}
.ab[disabled]{opacity:.4}

/* Board */
.turn{display:flex;align-items:center;gap:10px;font-weight:700;background:var(--s1);border:1px solid var(--line);padding:8px 14px;border-radius:999px;min-width:0}
.turn i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.turn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.col{display:flex;flex-direction:column;gap:8px}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:6px 2px}
.mid .badge{width:58px;height:58px;border-radius:16px}
.mid .badge svg{width:32px;height:32px}
.mid h3{font-size:16.5px;line-height:1.15}
.tile{font-family:var(--display);font-weight:800;font-size:20px;height:46px;border-radius:12px;background:var(--s2);color:var(--pri);border:1px solid var(--line);box-shadow:0 3px 0 var(--press);font-variant-numeric:tabular-nums}
.tile:active{transform:translateY(2px);box-shadow:none}
.tile.done{box-shadow:none;pointer-events:none;font-size:11px;font-family:var(--body);font-weight:700;display:grid;place-items:center;color:var(--on-team);background:var(--c);border:0;overflow:hidden;padding:0 4px;text-align:center}
.tile.miss{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.rail{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--s1);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.rail-in{display:flex;gap:8px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.chip{flex:1;max-width:250px;min-width:0;border-radius:14px;padding:7px 8px;background:var(--s2);border:1px solid var(--line);border-top:4px solid var(--c);display:flex;flex-direction:column;align-items:center;gap:3px}
.chip.cur{box-shadow:0 0 0 2px var(--c);background:var(--s1)}
.chip .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip .sc{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.chip .row{display:flex;gap:6px;align-items:center}
.chip .row button{font-size:11px;font-weight:700;color:var(--muted);padding:3px 7px;border-radius:7px;background:var(--s3)}
.chip .abtn{font-size:11px;font-weight:700;color:var(--c);padding:2px 6px}

/* Question */
.q{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
.q-in{max-width:900px;width:100%;margin:0 auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;flex:1;box-sizing:border-box}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.q-meta{display:flex;align-items:center;gap:12px;min-width:0}
.pts{font-family:var(--display);font-weight:800;font-size:28px;color:var(--pri);font-variant-numeric:tabular-nums;line-height:1.1}
.pts.hot{color:var(--bad)}
.ring{position:relative;width:78px;height:78px;flex:none;border-radius:50%}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.ring small{position:absolute;bottom:-18px;left:-10px;right:-10px;text-align:center;font-size:11px;color:var(--muted)}
.ring.low b{color:var(--bad)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-weight:500}
.tags b{color:var(--c)}
.tag-pill{background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--ink)}
.q-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.q-text{font-size:clamp(22px,4.6vw,38px);font-weight:700;line-height:1.3;text-wrap:balance}
.q-img{width:100%;max-width:640px;aspect-ratio:3/2;object-fit:contain;border-radius:16px;border:1px solid var(--line);background:#E9ECF1;align-self:center;display:block}
.q-emoji{font-size:clamp(48px,12vw,88px);letter-spacing:6px;text-align:center;line-height:1.2}
.hint{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:4px;background:var(--s1);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;align-self:flex-start}
.vid{display:flex;flex-direction:column;gap:8px}
.vid iframe{width:100%;aspect-ratio:16/9;max-width:100%;border:0;border-radius:16px;background:#000}
.vid a{color:var(--pri);font-weight:700;font-size:14px}
.vid-open{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.vid-open i{width:46px;height:46px;border-radius:50%;background:var(--bad);display:grid;place-items:center;flex:none}
.vid-open i::after{content:"";border-left:14px solid #fff;border-block:9px solid transparent;margin-left:4px}
.vid-open small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.ans{background:var(--s1);border:2px solid var(--good);border-radius:16px;padding:16px 18px;animation:pop .3s ease;box-shadow:var(--shadow)}
.ans small{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--good)}
.ans p{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,42px);line-height:1.1;margin:4px 0 0}
.ans .ar{font-family:"Readex Pro",sans-serif;font-weight:700;font-size:clamp(24px,5.5vw,36px);direction:rtl;margin-top:6px;color:var(--ink)}
.ans .alt{color:var(--muted);font-size:14px;margin-top:8px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.abrow{display:flex;flex-direction:column;gap:8px}
.abrow .tm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.abrow .tm>span{font-size:12px;font-weight:700;color:var(--c);min-width:70px}
.use{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-size:13px;font-weight:700}
.use svg{width:16px;height:16px}
.use.active{border-color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.use[disabled]{opacity:.35;pointer-events:none;text-decoration:line-through}
.q-acts{display:flex;gap:10px}
.q-acts .btn-pri{flex:1}
.award{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.award button{padding:16px 10px;border-radius:14px;font-weight:700;font-size:16px;background:var(--c);color:var(--on-team);box-shadow:0 4px 0 var(--press);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.award button.none{background:var(--s1);color:var(--ink);border:1px solid var(--line)}
.award small{display:block;font-size:11px;font-weight:500;opacity:.85}

/* End + modal */
.end{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;padding-top:6vh}
.end h1{font-size:clamp(40px,10vw,72px);color:var(--pri)}
.rank{width:min(480px,100%);display:flex;flex-direction:column;gap:10px}
.rank div{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:14px;background:var(--s1);border:1px solid var(--line);border-left:6px solid var(--c);font-weight:700}
.rank div span:last-child{font-family:var(--display);font-size:26px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:11px;height:11px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.modal{position:fixed;inset:0;background:var(--scrim);z-index:40;display:grid;place-items:center;padding:16px}
.modal>div{background:var(--s1);border-radius:18px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);max-height:85vh;overflow:auto}
.modal p{margin:0;color:var(--muted)}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;z-index:50;animation:pop .2s ease}
/* 16:9 landscape (tablets, unfolded phones, TVs): board fills one screen, question splits into two columns */
@media (min-width:880px) and (min-aspect-ratio:4/3){
 body[data-view="board"] .screen{max-width:none;height:100dvh;display:flex;flex-direction:column;padding-inline:2vw;padding-block:0 clamp(96px,11vh,130px)}
 body[data-view="board"] .top{padding-block:1.2vh}
 body[data-view="board"] .board{flex:1;min-height:0;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.4vw}
 body[data-view="board"] .card{grid-template-columns:22% minmax(0,1fr) 22%;padding:1vw;gap:1vw;min-height:0;border-radius:1.6vw}
 body[data-view="board"] .col{gap:.8vw;min-height:0}
 body[data-view="board"] .tile{flex:1;height:auto;min-height:0;font-size:clamp(20px,2.4vw,46px);border-radius:1vw}
 body[data-view="board"] .tile.done{font-size:clamp(11px,1vw,17px)}
 body[data-view="board"] .mid .badge{width:clamp(56px,6.5vw,120px);height:clamp(56px,6.5vw,120px);border-radius:1.6vw}
 body[data-view="board"] .mid .badge svg{width:56%;height:56%}
 body[data-view="board"] .mid h3{font-size:clamp(16px,1.8vw,32px)}
 .rail-in{gap:1vw}
 .chip{max-width:360px;padding:1vh 1vw}
 .chip .nm{font-size:clamp(13px,1.1vw,19px)}
 .chip .sc{font-size:clamp(26px,2.8vw,48px)}
 .q-in{max-width:none;padding-inline:3vw;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"head head" "tags tags" "body foot";column-gap:3vw;row-gap:1.6vh;height:100%}

   <div class="top"><button class="btn btn-soft" onclick="go('home')">Back</button><h2>New game</h2><button class="btn btn-line" onclick="setup.sound=!setup.sound;save();render()">${setup.sound?"Sound on":"Sound off"}</button></div>

    ${setup.teams.length<4?`<div><button class="btn btn-line" onclick="addTeam()">Add team</button></div>`:""}
   </div>
   <div class="sec"><span class="label">Answer timer</span><div class="seg">${[30,45,60,90].map(s=>`<button class="${setup.timer===s?"on":""}" onclick="setup.timer=${s};render()">${s} sec</button>`).join("")}</div></div>
   <div class="sec">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><span class="label">Categories</span><b style="color:var(--pri)">${n} of 6 picked</b></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn btn-acc" onclick="randomCats()" ${pool<6?"disabled":""}>${n?"Reroll":"Surprise me"}</button>${n?`<button class="btn btn-line" onclick="setup.cats=[];save();render()">Clear</button>`:""}<small style="color:var(--muted)">Surprise draws from ${pool} categories. Tap the dice on any card to leave just that one out.</small></div>
    ${n?`<div class="picked">${setup.cats.map(id=>`<button onclick="toggleCat('${id}')" aria-label="Remove ${esc(CAT[id].name)}"><span class="badge" style="--gc:${CAT[id].color};width:28px;height:28px;border-radius:8px">${icon(id)}</span>${esc(CAT[id].name)}<span class="x">&times;</span></button>`).join("")}</div>`:""}
    <label class="search">${P(IC.search).replace("<svg","<svg class='ico'")}<input id="q-search" placeholder="Search ${BANK.length} categories" value="${esc(query)}" oninput="query=this.value;render()"></label>
    ${groups.map(g=>`<div class="grp"><h3>${g.name} <small>${g.ids.length}</small></h3><div class="cats">${g.ids.map(catCard).join("")}</div></div>`).join("")||`<p style="color:var(--muted)">No categories match "${esc(query)}".</p>`}
   </div>
   <div class="dock"><button class="btn btn-pri" ${n===6?"":"disabled"} onclick="go('draft')">${n===6?"Next: pick abilities":`Pick ${6-n} more`}</button></div>
  </div>`;
}
function addTeam(){setup.teams.push(["Team Dhow","Team Pearl"][setup.teams.length-2]||"Team");render()}
function toggleCat(id){const i=setup.cats.indexOf(id);if(i>-1)setup.cats.splice(i,1);else if(setup.cats.length<6)setup.cats.push(id);else toast("6 categories already picked");save();render()}
function toggleEx(id){const i=setup.excl.indexOf(id);if(i>-1)setup.excl.splice(i,1);else{setup.excl.push(id);const j=setup.cats.indexOf(id);if(j>-1)setup.cats.splice(j,1)}save();render()}
function randomCats(){const prev=new Set(setup.cats);let pool=BANK.map(c=>c.id).filter(id=>!setup.excl.includes(id));const fresh=pool.filter(id=>!prev.has(id));const src=fresh.length>=6?fresh:pool;setup.cats=src.sort(()=>Math.random()-.5).slice(0,6);save();render()}

   <div class="top"><button class="btn btn-soft" onclick="go('setup')">Back</button><h2>Abilities</h2><span style="width:60px"></span></div>

   <div class="dock"><button class="btn btn-pri" ${ok?"":"disabled"} onclick="startGame()">${ok?"Start game":"Each team needs 3 abilities"}</button></div></div>`;

function togAb(i,id){const m=setup.abil[i]=setup.abil[i]||[];const k=m.indexOf(id);if(k>-1)m.splice(k,1);else if(m.length<3)m.push(id);save();render()}
function randAb(i){setup.abil[i]=AB.map(a=>a.id).sort(()=>Math.random()-.5).slice(0,3);save();render()}

function startGame(){
  const used=store.get("mj2_used",{});
  const cats=setup.cats.map(id=>{const c=CAT[id];used[id]=used[id]||[];const tiles=[];
    [200,400,600].forEach(p=>{const all=c.questions.map((q,i)=>({q,i})).filter(o=>o.q.p===p);let pool=all.filter(o=>!used[id].includes(o.i));
      if(pool.length<2){used[id]=used[id].filter(i=>c.questions[i].p!==p);pool=all}
      pool.sort(()=>Math.random()-.5).slice(0,2).forEach(o=>{used[id].push(o.i);tiles.push({p,qi:o.i,by:null,done:false})})});
    return {id,tiles}});
  store.set("mj2_used",used);
  game={teams:setup.teams.map((n,i)=>({name:(n||"").trim()||`Team ${i+1}`,score:0,abil:[...(setup.abil[i]||[])],used:{},sabo:false})),cats,turn:0,timer:setup.timer,over:false,hist:[]};
  save();keepAwake();go("board");
}
const qOf=(ci,ti)=>{const t=game.cats[ci].tiles[ti];return CAT[game.cats[ci].id].questions[t.qi]};
const cur=()=>qOf(Q.ci,Q.ti);

function adj(i,v){game.teams[i].score+=v;save();render()}
function modal(html){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div>${html}</div>`;m.addEventListener("click",e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
function teamSheet(i){const t=game.teams[i];
  const m=modal(`<h3 style="font-size:22px;color:${COLORS[i]}">${esc(t.name)}</h3><p>Board abilities can be used here. Question abilities appear on the question screen.</p>

   <div class="row"><button class="btn btn-soft" data-close>Close</button></div>`);
  m.querySelector("[data-close]").onclick=()=>m.remove();
  m.querySelectorAll("[data-ab]").forEach(b=>b.onclick=()=>{const id=b.dataset.ab;m.remove();
    if(id==="turn"){t.used.turn=true;game.turn=i;save();render();toast(t.name+" takes the turn")}
    if(id==="sabo"){pickTeam(i,"Sabotage which team?",j=>{t.used.sabo=true;game.teams[j].sabo=true;save();render();toast(game.teams[j].name+" gets half time next question")})}
  });

function pickTeam(self,title,cb){const m=modal(`<h3 style="font-size:22px">${title}</h3><div class="award">${game.teams.map((t,j)=>j===self?"":`<button style="--c:${COLORS[j]}" data-j="${j}">${esc(t.name)}</button>`).join("")}</div><div class="row"><button class="btn btn-soft" data-close>Cancel</button></div>`);
  m.querySelector("[data-close]").onclick=()=>m.remove();m.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{m.remove();cb(+b.dataset.j)})}

function vidHTML(x){if(!x.yt)return "";const s=x.start||0,e=x.end||s+30,url=`https://www.youtube.com/watch?v=${x.yt}&t=${s}s`;
  if(ytBlocked)return `<a class="vid-open" href="${url}" target="_blank" rel="noopener"><i></i><span><b>Play the clip</b><small>Opens YouTube at ${s}s. Watch until ${e}s, then come back.</small></span></a>`;
  return `<div class="vid"><iframe id="ytf" src="https://www.youtube-nocookie.com/embed/${x.yt}?start=${s}&end=${e}&rel=0&playsinline=1&fs=1&modestbranding=1${location.protocol==="https:"?"&origin="+encodeURIComponent(location.origin):""}" referrerpolicy="strict-origin-when-cross-origin" title="Question clip" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe><a href="${url}" target="_blank" rel="noopener">Clip not playing? Open on YouTube</a></div>`}
function mediaHTML(x){let h="";if(x.img)h+=`<img class="q-img" alt="Picture for this question" src="${esc(x.img)}">`;if(x.svg)h+=`<img class="q-img" alt="Picture for this question" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(x.svg)}">`;if(x.emoji)h+=`<div class="q-emoji">${esc(x.emoji)}</div>`;return h+`<div id="vidbox">${vidHTML(x)}</div>`}
function hintOf(a){return String(a).split(/\s+/).map(w=>w[0]+" _".repeat(Math.max(0,w.length-1))).join("   ")}

function openQ(ci,ti){
  const tt=game.teams[game.turn];let left=game.timer;
  if(tt.sabo){left=Math.ceil(game.timer/2);tt.sabo=false;save()}
  Q={ci,ti,left,total:left,revealed:false,team:game.turn,picker:game.turn,mult:1,risk:false,insure:false,pick:false,hint:false,two:false,room:false,freeze:0,paused:false,first:null,block:null,active:{}};
  const el=document.createElement("div");el.className="q";el.id="qv";document.body.appendChild(el);document.body.style.overflow="hidden";
  buildQ();startTick();beep(660,.08);
}
function buildQ(){const c=CAT[game.cats[Q.ci].id],x=cur();
  $("#qv").innerHTML=`<div class="band"></div><div class="q-in"><div class="q-head" id="qhead"></div><div class="tags" id="qtags"></div>
   <div class="q-body"><div class="q-text">${esc(x.q)}</div>${mediaHTML(x)}<div id="qhint"></div><div id="qans"></div></div><div id="qfoot"></div></div>`;
  drawQ()}
function drawQ(){
  const c=CAT[game.cats[Q.ci].id],x=cur(),tile=game.cats[Q.ci].tiles[Q.ti],t=game.teams[Q.team];
  const R=33,C=2*Math.PI*R,frac=Math.max(0,Q.left)/Q.total,low=Q.left<=10;
  $("#qhead").innerHTML=`<div class="q-meta"><span class="badge" style="--gc:${c.color};width:48px;height:48px">${icon(c.id)}</span><div style="min-width:0"><div class="label">${esc(c.name)}</div><div class="pts ${Q.mult>1?"hot":""}">${tile.p*Q.mult} pts${Q.mult>1?` (x${Q.mult})`:""}</div></div></div>
   ${Q.revealed?"":`<button class="ring ${low?"low":""}" onclick="pauseT()" aria-label="${Q.paused?"Resume":"Pause"} timer"><svg width="78" height="78" viewBox="0 0 78 78"><circle cx="39" cy="39" r="${R}" stroke="var(--s3)" stroke-width="7" fill="none"/><circle id="arc" cx="39" cy="39" r="${R}" stroke="${low?"var(--bad)":"var(--pri)"}" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg><b id="secs">${Math.max(0,Q.left)}</b><small id="tsub">${Q.freeze>0?"Frozen "+Q.freeze+"s":Q.paused?"Paused":"Tap to pause"}</small></button>`}`;
  const tags=[];
  tags.push(`<span style="--c:${COLORS[Q.team]}">Answering: <b>${esc(t.name)}</b></span>`);
  if(Q.two)tags.push(`<span class="tag-pill">Two guesses</span>`);if(Q.room)tags.push(`<span class="tag-pill">Ask the room: 15 sec</span>`);
  if(Q.insure)tags.push(`<span class="tag-pill">Insured</span>`);if(Q.pick)tags.push(`<span class="tag-pill">Pickpocket</span>`);if(Q.risk)tags.push(`<span class="tag-pill">Risk it</span>`);
  if(Q.first!==null)tags.push(`<span class="tag-pill">${esc(game.teams[Q.first].name)} steals first</span>`);if(Q.block!==null)tags.push(`<span class="tag-pill">${esc(game.teams[Q.block].name)} blocked</span>`);
  if(!Q.revealed&&Q.left<=0)tags.push(`<span style="color:var(--bad);font-weight:700">Time is up. Others can steal.</span>`);
  $("#qtags").innerHTML=tags.join("");
  $("#qhint").innerHTML=Q.hint&&!Q.revealed?`<div class="hint" aria-label="Hint">${esc(hintOf(x.a))}</div>`:"";
  $("#qans").innerHTML=Q.revealed?`<div class="ans"><small>Answer</small><p>${esc(x.a)}</p>${x.ar?`<div class="ar" lang="ar">${esc(x.ar)}</div>`:""}${x.alt&&x.alt.length?`<div class="alt">Also accepted: ${x.alt.map(esc).join(", ")}</div>`:""}</div>`:"";
  if(!Q.revealed){
    const rows=game.teams.map((tm,i)=>{const list=tm.abil.filter(id=>{const a=ABM[id];if(a.when!=="q")return false;if(a.who==="ans")return i===Q.team;if(a.who==="other")return i!==Q.team;return true});if(!list.length)return "";
      return `<div class="tm" style="--c:${COLORS[i]}"><span>${esc(tm.name)}</span>${list.map(id=>{const a=ABM[id],u=tm.used[id],dis=u||(["double","risk"].includes(id)&&Q.mult>1);return `<button class="use ${Q.active[i+id]?"active":""}" style="--c:${COLORS[i]}" ${dis?"disabled":""} onclick="useAb(${i},'${id}')" title="${esc(a.desc)}">${P(IC[a.ico])}${a.name}</button>`}).join("")}</div>`}).join("");
    $("#qfoot").innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">${rows?`<div class="abrow">${rows}</div>`:""}<div class="q-acts"><button class="btn btn-soft" onclick="closeQ(false)">Back</button><button class="btn btn-pri" onclick="reveal()">Show answer</button></div></div>`;
  }else{
    $("#qfoot").innerHTML=`<div><div class="label" style="margin-bottom:10px">Who got it right?</div><div class="award">${game.teams.map((tm,i)=>{const blocked=Q.block===i&&i!==Q.team;return `<button style="--c:${COLORS[i]}" ${blocked?"disabled":""} onclick="award(${i})">${esc(tm.name)}<small>${i===Q.team?"+"+tile.p*Q.mult+(Q.pick?" & pickpocket":""):blocked?"Blocked":"Steal +"+tile.p}</small></button>`}).join("")}<button class="none" onclick="award(null)">No one<small>${Q.risk?"-"+tile.p+" for "+esc(t.name):Q.insure?"+"+tile.p/2+" insurance":"Tile is lost"}</small></button></div></div>`;
  }
}
function setArc(){const R=33,C=2*Math.PI*R,arc=$("#arc"),s=$("#secs"),sub=$("#tsub");if(arc){arc.setAttribute("stroke-dashoffset",C*(1-Math.max(0,Q.left)/Q.total));if(Q.left<=10){arc.setAttribute("stroke","var(--bad)");$(".ring").classList.add("low")}}if(s)s.textContent=Math.max(0,Q.left);if(sub)sub.textContent=Q.freeze>0?"Frozen "+Q.freeze+"s":Q.paused?"Paused":"Tap to pause"}
function startTick(){clearInterval(tick);tick=setInterval(()=>{if(!Q||Q.revealed){clearInterval(tick);return}if(Q.paused||Q.left<=0)return;
  if(Q.freeze>0){Q.freeze--;setArc();return}
  Q.left--;if(Q.left<=5&&Q.left>0)beep(990,.07);
  if(Q.left===0){beep(220,.5);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}drawQ();return}setArc()},1000)}
function pauseT(){if(!Q||Q.revealed)return;Q.paused=!Q.paused;setArc()}
function freshQ(ci,p){const id=game.cats[ci].id,c=CAT[id],inUse=new Set(game.cats[ci].tiles.map(t=>t.qi)),used=store.get("mj2_used",{});used[id]=used[id]||[];
  let pool=c.questions.map((q,i)=>({q,i})).filter(o=>o.q.p===p&&!inUse.has(o.i)&&!used[id].includes(o.i));
  if(!pool.length)pool=c.questions.map((q,i)=>({q,i})).filter(o=>o.q.p===p&&!inUse.has(o.i));
  if(!pool.length)return null;const pick=pool[Math.floor(Math.random()*pool.length)];used[id].push(pick.i);store.set("mj2_used",used);return pick.i}
function useAb(i,id){const tm=game.teams[i];if(tm.used[id])return;const tile=game.cats[Q.ci].tiles[Q.ti];
  const done=()=>{tm.used[id]=true;Q.active[i+id]=true;save();drawQ();beep(1200,.1)};
  switch(id){
   case"time":Q.left+=30;Q.total+=30;done();break;
   case"double":Q.mult=2;done();break;
   case"risk":Q.mult=3;Q.risk=true;done();break;
   case"swap":case"ease":{const qi=freshQ(Q.ci,id==="ease"?200:tile.p);if(qi===null){toast("No other question available");return}tile.qi=qi;tm.used[id]=true;save();buildQ();toast(id==="ease"?"Easier question, same points":"New question");break}
   case"hint":Q.hint=true;done();break;
   case"two":Q.two=true;done();break;
   case"room":Q.room=true;done();break;
   case"insure":Q.insure=true;done();break;
   case"pick":Q.pick=true;done();break;
   case"freeze":Q.freeze=20;done();break;
   case"first":Q.first=i;done();break;
   case"pass":pickTeam(i,"Pass this question to which team?",j=>{Q.team=j;tm.used.pass=true;save();drawQ();toast(game.teams[j].name+" must answer")});break;
   case"block":pickTeam(i,"Block which team from stealing?",j=>{Q.block=j;tm.used.block=true;save();drawQ()});break;
  }}
function reveal(){Q.revealed=true;clearInterval(tick);drawQ();beep(520,.15)}
function award(i){
  const tile=game.cats[Q.ci].tiles[Q.ti],ans=game.teams[Q.team];
  game.hist.push({ci:Q.ci,ti:Q.ti,teams:JSON.parse(JSON.stringify(game.teams)),turn:game.turn});if(game.hist.length>20)game.hist.shift();
  if(i===Q.team){ans.score+=tile.p*Q.mult;
    if(Q.pick){const rivals=game.teams.map((t,j)=>({t,j})).filter(o=>o.j!==i).sort((a,b)=>b.t.score-a.t.score);if(rivals.length){const take=Math.min(200,Math.max(0,rivals[0].t.score));rivals[0].t.score-=take;ans.score+=take}}
    beep(1320,.2)}
  else{if(i!==null){game.teams[i].score+=tile.p;beep(1320,.2)}if(Q.risk)ans.score-=tile.p;if(Q.insure)ans.score+=tile.p/2}
  tile.done=true;tile.by=i;game.turn=(Q.picker+1)%game.teams.length;
  closeQ(true);
  if(game.cats.every(c=>c.tiles.every(t=>t.done))){game.over=true;save();go("end")}
}
function undo(){const h=game.hist.pop();if(!h)return;game.teams=h.teams;game.turn=h.turn;const t=game.cats[h.ci].tiles[h.ti];t.done=false;t.by=null;save();render();toast("Last result undone")}
function closeQ(s){clearInterval(tick);const el=$("#qv");if(el)el.remove();document.body.style.overflow="";Q=null;if(s)save();render()}
function confirmEnd(){const m=modal(`<h3 style="font-size:24px">End this game?</h3><p>The current scores decide the winner.</p><div class="row"><button class="btn btn-soft" data-no>Keep playing</button><button class="btn btn-pri" data-yes>End game</button></div>`);
  m.querySelector("[data-no]").onclick=()=>m.remove();m.querySelector("[data-yes]").onclick=()=>{m.remove();game.over=true;save();go("end")}}
function endHTML(){const order=game.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score),tie=order.length>1&&order[0].score===order[1].score;setTimeout(confetti,50);
  return `<div class="band"></div><div class="screen end"><span class="label">Final scores</span><h1>${tie?"It's a tie":esc(order[0].name)+" wins"}</h1>
   <div class="rank">${order.map((t,k)=>`<div style="--c:${COLORS[t.i]}"><span>${k+1}. ${esc(t.name)}</span><span>${t.score}</span></div>`).join("")}</div>
   <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="btn btn-pri" onclick="go('draft')">Rematch</button><button class="btn btn-soft" onclick="go('setup')">Change setup</button></div></div>`}
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const b=document.createElement("div");b.className="confetti";const cs=getComputedStyle(document.documentElement),cols=["--t1","--t2","--t3","--t4"].map(v=>cs.getPropertyValue(v));for(let k=0;k<80;k++){const i=document.createElement("i");i.style.left=Math.random()*100+"%";i.style.background=cols[k%4];i.style.animationDuration=(2+Math.random()*2.5)+"s";i.style.animationDelay=Math.random()*.8+"s";b.appendChild(i)}document.body.appendChild(b);setTimeout(()=>b.remove(),5200)}
function go(v){view=v;if(v!=="setup")query="";render();window.scrollTo(0,0)}
window.onAndroidBack=function(){const m=document.querySelector(".modal");if(m){m.remove();return true}if(Q){closeQ(false);return true}if(view==="draft"){go("setup");return true}if(view==="setup"||view==="board"||view==="end"){go("home");return true}return false};
applySkin();render();
