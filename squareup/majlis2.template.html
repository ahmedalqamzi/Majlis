<meta charset="utf-8">
<title>Majlis</title>
<meta name="theme-color" content="#0D2742">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Majlis">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: a picture-led game-show board readable from the sofa. Each category is a solid colour card led by a big 3D illustration with white point tiles either side; teams sit on a bottom bench with mascots; questions take the full screen. Night is the default skin, Day the light one. */
:root{
  --bg:#0D2742;--s1:#15365A;--s2:#1C426B;--s3:#25507E;--line:#2C5A8A;--ink:#FFFFFF;--muted:#A8C2DD;
  --pri:#FFC93C;--pri-ink:#2A1C00;--pri-edge:#C9930E;--acc:#FF6B6B;--acc-ink:#2B0606;
  --tile:#FFFFFF;--tile-ink:#0D2742;--tile-edge:#C9D6E4;
  --press:rgba(0,0,0,.28);--scrim:rgba(5,15,28,.78);--shadow:0 10px 30px rgba(0,0,0,.25);
  --t1:#FF6B6B;--t2:#4DABF7;--t3:#51CF66;--t4:#CC5DE8;--on-team:#FFFFFF;--good:#51CF66;--bad:#FF6B6B;--img-bg:#E8EEF5;
  --display:"Baloo Bhaijaan 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;--body:"Rubik","Segoe UI",system-ui,sans-serif;--num:"Baloo Bhaijaan 2","Arial Rounded MT Bold",sans-serif;
  --r:14px;--r-lg:22px;
  color-scheme:dark;
}
:root[data-skin="day"]{--bg:#EAF3FB;--s1:#FFFFFF;--s2:#F2F7FC;--s3:#DDE8F3;--line:#C8D8E8;--ink:#0D2742;--muted:#4D6A88;--tile:#FFFFFF;--tile-ink:#0D2742;--tile-edge:#B9CBDD;--press:rgba(13,39,66,.18);--scrim:rgba(13,39,66,.55);--shadow:0 10px 30px rgba(13,39,66,.12);--t1:#E03131;--t2:#1C7ED6;--t3:#2F9E44;--t4:#9C36B5;--good:#2F9E44;--bad:#E03131;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;margin:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;line-height:1.1}
.screen{min-height:100%;padding-inline:16px;padding-block:0 140px;max-width:1180px;margin:0 auto;box-sizing:border-box}
.band{display:none}
.art{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:999px;font-weight:700;font-size:17px;font-family:var(--display);transition:transform .1s}
.btn:active{transform:translateY(3px)}
.btn-pri{background:var(--pri);color:var(--pri-ink);box-shadow:0 5px 0 var(--pri-edge)}
.btn-pri:active{box-shadow:0 2px 0 var(--pri-edge)}
.btn-acc{background:var(--acc);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--acc) 60%,#000)}
.btn-soft{background:var(--s2);color:var(--ink);box-shadow:0 4px 0 var(--press)}
.btn-line{color:var(--ink);background:transparent;box-shadow:inset 0 0 0 2px var(--line);padding:10px 16px;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.label{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.top h2{font-size:28px}
.ico{width:22px;height:22px;flex:none}
.skins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.skins button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--s1);font-size:14px;font-weight:600;box-shadow:inset 0 0 0 2px var(--line)}
.skins button.on{box-shadow:inset 0 0 0 2px var(--pri)}
.skins i{width:16px;height:16px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(127,127,127,.5)}

/* Home: floating art ring around the wordmark */
.home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-top:2vh}
.hero{position:relative;width:min(560px,100%);aspect-ratio:1.35;display:grid;place-items:center;max-width:100%}
.hero img{position:absolute;width:clamp(54px,15%,92px);aspect-ratio:1;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(0,0,0,.25))}
@keyframes bob{50%{transform:translateY(-8px) rotate(var(--rot,0deg))}}
.mark{position:relative;display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:800;line-height:.95;z-index:1}
.mark .en{font-size:clamp(64px,17vw,120px);color:var(--pri);text-shadow:0 6px 0 var(--pri-edge)}
.mark .ar{font-size:clamp(28px,7vw,46px);color:var(--ink);margin-top:6px}
.tag{color:var(--muted);max-width:36ch;line-height:1.55;margin:0;font-size:17px}
.facts{display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:center;font-size:15px;color:var(--muted)}
.facts b{font-family:var(--num);font-weight:800;color:var(--ink);font-size:21px;margin-right:4px;font-variant-numeric:tabular-nums}
.acts{display:flex;flex-direction:column;gap:14px;width:min(340px,100%)}

/* Setup */
.setup{display:flex;flex-direction:column;gap:28px}
.sec{display:flex;flex-direction:column;gap:12px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.team-in{display:flex;align-items:center;gap:10px;background:var(--s1);border-radius:var(--r);padding:6px 10px 6px 6px;box-shadow:inset 0 0 0 2px var(--c)}
.team-in .av{width:46px;height:46px;flex:none;border-radius:12px;background:color-mix(in srgb,var(--c) 22%,transparent);padding:4px;box-sizing:border-box}
.team-in input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:600 18px var(--display);padding:8px 0}
.team-in button.x{color:var(--muted);font-size:24px;line-height:1;padding:4px 8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:10px 18px;border-radius:999px;background:var(--s1);box-shadow:inset 0 0 0 2px var(--line);font-weight:700;font-family:var(--num);font-size:16px}
.seg button.on{background:var(--pri);color:var(--pri-ink);box-shadow:none}
.search{display:flex;align-items:center;gap:10px;background:var(--s1);border-radius:999px;padding:4px 18px;box-shadow:inset 0 0 0 2px var(--line)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:400 16px var(--body);padding:10px 0}
.picked{display:flex;gap:8px;flex-wrap:wrap}
.picked button{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--gc);color:#fff;font-weight:600;font-size:14px}
.picked button .badge{width:30px;height:30px;background:rgba(255,255,255,.22);border-radius:50%;padding:3px}
.picked button .x{font-size:18px;line-height:1;opacity:.8}
.grp{display:flex;flex-direction:column;gap:12px}
.grp h3{font-size:24px;display:flex;align-items:baseline;gap:10px}
.grp h3 i{width:12px;height:12px;border-radius:50%;background:var(--gc);display:inline-block;align-self:center}
.grp h3 small{font-family:var(--num);font-weight:600;font-size:15px;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat{position:relative;display:flex;flex-direction:column;background:var(--gc);color:#fff;border-radius:var(--r);box-shadow:0 4px 0 color-mix(in srgb,var(--gc) 60%,#000);overflow:hidden}
.cat .main{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px 10px;flex:1;min-width:0}
.cat .badge{width:64px;height:64px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.cat .nm{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.15;min-width:0}
.cat .nm small{display:block;font-family:var(--body);font-weight:400;opacity:.85;font-size:11.5px;margin-top:3px}
.cat.on{box-shadow:0 0 0 4px var(--pri),0 4px 0 color-mix(in srgb,var(--gc) 60%,#000)}
.cat.on::after{content:attr(data-n);position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:800;font-size:14px;font-family:var(--num)}
.cat.ex{filter:grayscale(.85);opacity:.6}
.exbtn{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.18)}
.exbtn svg{width:18px;height:18px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%);display:flex;justify-content:center;z-index:5}
.dock .btn{width:min(420px,100%)}

/* Steal */
.steal{display:flex;flex-direction:column;gap:8px}
.steal-row{display:flex;gap:8px;flex-wrap:wrap}
.steal-b{flex:1 1 140px;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:var(--r);background:var(--s1);box-shadow:inset 0 0 0 2px var(--c);color:var(--ink);font-weight:700;text-align:left;cursor:pointer;font-family:var(--display);font-size:17px}
.steal-b img{width:38px;height:38px;flex:none}
.steal-b small{display:block;font-family:var(--body);font-size:12.5px;font-weight:400;color:var(--muted)}
.steal-b.on{background:var(--c);color:#fff}.steal-b.on small{color:#fff}
.steal-b:disabled:not(.on){opacity:.45;cursor:default}
.award button.hl{box-shadow:0 0 0 4px var(--pri)}
.arw{font-family:var(--display);unicode-bidi:isolate;white-space:nowrap}
/* Abilities draft */
.draft{display:flex;flex-direction:column;gap:22px}
.dteam{background:var(--s1);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 2px var(--c)}
.dteam header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dteam header .who{display:flex;align-items:center;gap:10px}
.dteam header .who img{width:44px;height:44px}
.dteam h3{font-size:24px}
.dteam b{font-family:var(--num)}
.abil{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ab{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px;border-radius:var(--r);background:var(--s2)}
.ab .ai{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--s3);color:var(--ink)}
.ab .ai svg{width:20px;height:20px}
.ab b{display:block;font-size:15px;font-family:var(--display)}
.ab small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:2px}
.ab.on{background:var(--c);color:#fff}.ab.on small{color:rgba(255,255,255,.9)}
.ab.on .ai{background:rgba(255,255,255,.25);color:#fff}
.ab[disabled]{opacity:.4}

/* Board */
.turn{display:flex;align-items:center;gap:8px;font-weight:700;font-family:var(--display);font-size:17px;background:var(--c);color:#fff;padding:4px 16px 4px 4px;border-radius:999px;min-width:0}
.turn img{width:34px;height:34px;flex:none}
.turn i{display:none}
.turn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){.fs-btn{display:none}}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{position:relative;display:grid;grid-template-columns:64px 1fr 64px;gap:10px;background:var(--gc);color:#fff;border-radius:var(--r-lg);padding:10px;box-shadow:0 5px 0 color-mix(in srgb,var(--gc) 55%,#000)}
.col{display:flex;flex-direction:column;gap:8px}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:4px 2px;min-width:0}
.mid .badge{width:96px;height:96px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.28))}
.mid h3{font-size:18px;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile{font-family:var(--num);font-weight:800;font-size:23px;height:48px;border-radius:12px;background:var(--tile);color:var(--tile-ink);box-shadow:0 4px 0 rgba(0,0,0,.22);font-variant-numeric:tabular-nums}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.tile.done{box-shadow:none;pointer-events:none;font-size:11px;font-family:var(--body);font-weight:700;display:grid;place-items:center;color:#fff;background:var(--c);overflow:hidden;padding:0 4px;text-align:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.tile.miss{background:rgba(0,0,0,.18);color:rgba(255,255,255,.75);box-shadow:none}
.rail{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--s1);box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.rail-in{display:flex;gap:10px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.chip{flex:1;max-width:280px;min-width:0;border-radius:var(--r);padding:6px 10px 6px 6px;background:var(--s2);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center}
.chip .cav{grid-row:1/3;width:48px;height:48px;border-radius:12px;background:color-mix(in srgb,var(--c) 25%,transparent);padding:4px;box-sizing:border-box}
.chip.cur{background:var(--c);color:#fff}
.chip.cur .cav{background:rgba(255,255,255,.25)}
.chip .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;justify-content:space-between;gap:6px}
.chip .sc{font-family:var(--num);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.chip .row{grid-column:1/3;display:flex;gap:6px;align-items:center;justify-content:center;margin-top:4px}
.chip .row button{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(127,127,127,.18)}
.chip .abtn{font-size:11.5px;font-weight:700;padding:2px 6px}

/* Question */
.q{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
.q-in{max-width:900px;width:100%;margin:0 auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;flex:1;box-sizing:border-box}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.q-meta{display:flex;align-items:center;gap:12px;min-width:0}
.q-meta .badge{width:60px!important;height:60px!important;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.pts{font-family:var(--num);font-weight:800;font-size:34px;color:var(--pri);font-variant-numeric:tabular-nums;line-height:1}
.pts.hot{color:var(--bad)}
.ring{position:relative;width:78px;height:78px;flex:none;border-radius:50%}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.ring small{position:absolute;bottom:-18px;left:-10px;right:-10px;text-align:center;font-size:11px;color:var(--muted)}
.ring.low b{color:var(--bad)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-weight:500}
.tags b{color:var(--c)}
.tag-pill{background:var(--s2);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink)}
.q-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.q-text{font-family:var(--display);font-size:clamp(26px,5vw,44px);font-weight:700;line-height:1.25;text-wrap:balance}
.q-art{width:clamp(110px,26vw,190px);aspect-ratio:1;align-self:center;filter:drop-shadow(0 10px 14px rgba(0,0,0,.28));animation:pop .4s ease}
.q-img{width:100%;max-width:640px;aspect-ratio:3/2;object-fit:contain;border-radius:var(--r-lg);background:var(--img-bg);align-self:center;display:block;box-shadow:var(--shadow)}
.q-emoji{font-size:clamp(48px,12vw,88px);letter-spacing:6px;text-align:center;line-height:1.2}
.hint{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:4px;background:var(--s1);border-radius:var(--r);padding:10px 14px;align-self:flex-start;box-shadow:inset 0 0 0 2px var(--pri)}
.vid{position:relative;display:flex;flex-direction:column;gap:8px}
.vid iframe{width:100%;aspect-ratio:16/9;max-width:100%;border:0;border-radius:var(--r-lg);background:#000}
.vid a{color:var(--pri);font-weight:700;font-size:14px}
.aud-mode iframe{position:absolute;left:0;top:0;width:320px;height:200px;opacity:0;pointer-events:none}
.aud-mode>a{display:none}
.vid:not(.aud-mode) .aud-card{display:none}
.aud-card{display:flex;align-items:center;gap:14px;background:var(--s1);border-radius:var(--r-lg);padding:16px;position:relative;z-index:1}
.aud-card b{display:block;font-family:var(--display);font-size:19px}.aud-card small{color:var(--muted)}
.aud-btn{width:64px;height:64px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-ink);font-size:24px;flex:none;cursor:pointer;box-shadow:0 4px 0 var(--pri-edge)}
.aud-re{margin-left:auto;background:var(--s2);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
.wpic:empty{display:none}
.ans .q-img{max-height:42vh;width:auto;margin-top:12px}
.vid-open{display:flex;align-items:center;gap:12px;background:var(--s1);border-radius:var(--r-lg);padding:16px;text-decoration:none;color:var(--ink)}
.vid-open i{width:48px;height:48px;border-radius:50%;background:var(--acc);display:grid;place-items:center;flex:none}
.vid-open i::after{content:"";border-left:14px solid #fff;border-block:9px solid transparent;margin-left:4px}
.vid-open small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.ans{position:relative;background:var(--good);color:#06240E;border-radius:var(--r-lg);padding:16px 20px;animation:pop .35s cubic-bezier(.2,1.4,.4,1);box-shadow:0 5px 0 color-mix(in srgb,var(--good) 55%,#000)}
.ans small{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;opacity:.8}
.ans p{font-family:var(--display);font-weight:800;font-size:clamp(28px,6.5vw,46px);line-height:1.15;margin:2px 0 0}
.ans .alt{font-size:14px;margin-top:6px;opacity:.85}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.abrow{display:flex;flex-direction:column;gap:8px}
.abrow .tm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.abrow .tm>span{font-size:12px;font-weight:700;color:var(--c);min-width:70px}
.use{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--s1);box-shadow:inset 0 0 0 2px var(--line);font-size:13px;font-weight:700}
.use svg{width:16px;height:16px}
.use.active{background:var(--c);color:#fff;box-shadow:none}
.use[disabled]{opacity:.35;pointer-events:none;text-decoration:line-through}
.q-acts{display:flex;gap:10px}
.q-acts .btn-pri{flex:1}
.award{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.award button{padding:16px 10px;border-radius:var(--r);font-weight:800;font-size:18px;font-family:var(--display);background:var(--c);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 55%,#000);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.award button.none{background:var(--s2);color:var(--ink);box-shadow:0 5px 0 var(--press)}
.award small{display:block;font-size:12px;font-weight:500;opacity:.9;font-family:var(--body)}

/* End + modal */
.end{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;padding-top:6vh}
.end h1{font-size:clamp(40px,10vw,76px);color:var(--pri)}
.rank{width:min(480px,100%);display:flex;flex-direction:column;gap:10px}
.rank div{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-radius:var(--r);background:var(--c);color:#fff;font-weight:700;font-family:var(--display);font-size:19px}
.rank div span:last-child{font-family:var(--num);font-size:28px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:11px;height:11px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

async function keepAwake(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}}

function toggleFS(){try{if(document.fullscreenElement){document.exitFullscreen()}else{const p=document.documentElement.requestFullscreen({navigationUI:"hide"});if(p&&p.catch)p.catch(()=>toast("Full screen is blocked here. Use Add to Home screen."))}}catch(e){toast("Full screen is blocked here. Use Add to Home screen.")}}
function render(){document.body.dataset.view=view;const a=$("#app");a.innerHTML=view==="home"?homeHTML():view==="setup"?setupHTML():view==="draft"?draftHTML():view==="board"?boardHTML():endHTML();if(view==="setup"){const s=$("#q-search");if(s&&query){s.focus();s.setSelectionRange(query.length,query.length)}}}
function skinsHTML(){return `<div class="skins">${SKINS.map(s=>`<button class="${skin===s.id?"on":""}" onclick="setSkin('${s.id}')"><i style="background:${s.sw}"></i>${s.name}</button>`).join("")}</div>`}

const HERO=[[2,8,-8],[22,0,6],[44,-4,-4],[66,0,8],[84,10,-6],[88,40,6],[82,70,-8],[62,78,6],[40,82,-6],[18,76,8],[0,62,-6],[-2,36,6]];
function homeHTML(){
  const total=BANK.reduce((n,c)=>n+c.questions.length,0),pics=BANK.reduce((n,c)=>n+c.questions.filter(q=>q.svg||q.emoji||q.img||q.pic||q.apic).length,0),vids=BANK.reduce((n,c)=>n+c.questions.filter(q=>q.yt).length,0),resume=game&&!game.over;
  return `<div class="band"></div><div class="screen"><div class="home">
   <div class="hero">${HERO.map((p,k)=>`<img src="${ART["home-"+k]}" alt="" style="left:${p[0]}%;top:${p[1]}%;--rot:${p[2]}deg;animation-delay:${-k*.4}s">`).join("")}<div class="mark"><span class="en">Majlis</span><span class="ar" lang="ar">مجلس</span></div></div>
   <p class="tag">Team trivia for nights in the majlis. Pick six categories, draft your abilities, and chase the 600s.</p>
   <div class="facts"><span><b>${BANK.length}</b>categories</span><span><b>${total.toLocaleString()}</b>questions</span><span><b>${pics.toLocaleString()}</b>with pictures</span><span><b>${vids}</b>clips</span></div>
   <div class="acts">${resume?`<button class="btn btn-acc" onclick="go('board')">Resume game</button>`:""}<button class="btn btn-pri" onclick="go('setup')">New game</button><button class="btn btn-line" onclick="toggleFS()">Full screen</button></div>
   <span class="label">Theme</span>${skinsHTML()}
  </div></div>`;
}

function catCard(id){const c=CAT[id],idx=setup.cats.indexOf(id),ex=setup.excl.includes(id),pics=c.questions.filter(q=>q.svg||q.emoji||q.yt||q.img||q.pic||q.apic).length;
  return `<div class="cat ${idx>-1?"on":""} ${ex?"ex":""}" data-n="${idx+1}" style="--gc:${c.color}"><button class="main" onclick="toggleCat('${id}')"><span class="badge">${icon(id)}</span><span class="nm">${esc(c.name)}<small>${ex?"Left out of Surprise":c.questions.length+" questions"+(pics?` · ${pics} media`:"")}</small></span></button><button class="exbtn" onclick="toggleEx('${id}')" aria-label="${ex?"Include in":"Leave out of"} Surprise">${ex?DICE_X:DICE}</button></div>`}
function setupHTML(){
  const n=setup.cats.length,pool=BANK.filter(c=>!setup.excl.includes(c.id)).length,ql=query.trim().toLowerCase();
  const groups=GROUPS.map(g=>({...g,ids:g.ids.filter(id=>!ql||CAT[id].name.toLowerCase().includes(ql)||g.name.toLowerCase().includes(ql))})).filter(g=>g.ids.length);
  return `<div class="band"></div><div class="screen setup">
   <div class="top"><button class="btn btn-soft" onclick="go('home')">Back</button><h2>New game</h2><button class="btn btn-line" onclick="setup.sound=!setup.sound;save();render()">${setup.sound?"Sound on":"Sound off"}</button></div>
   <div class="sec"><span class="label">Teams</span>
    <div class="teams">${setup.teams.map((t,i)=>`<label class="team-in" style="--c:${COLORS[i]}"><button class="av" onclick="event.preventDefault();setup.av[${i}]=((setup.av[${i}]||0)+1)%AVN;save();render()" aria-label="Change team ${i+1} mascot">${avImg(setup.av[i])}</button><input id="team${i}" value="${esc(t)}" maxlength="18" aria-label="Team ${i+1} name" oninput="setup.teams[${i}]=this.value;save()">${setup.teams.length>2?`<button class="x" onclick="setup.teams.splice(${i},1);setup.av.splice(${i},1);setup.av.push(${i});render()" aria-label="Remove team">&times;</button>`:""}</label>`).join("")}</div>
    ${setup.teams.length<4?`<div><button class="btn btn-line" onclick="addTeam()">Add team</button></div>`:""}
   </div>
   <div class="sec"><span class="label">Answer timer</span><div class="seg">${[30,45,60,90].map(s=>`<button class="${setup.timer===s?"on":""}" onclick="setup.timer=${s};render()">${s} sec</button>`).join("")}</div></div>
   <div class="sec">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><span class="label">Categories</span><b style="color:var(--pri)">${n} of 6 picked</b></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn btn-acc" onclick="randomCats()" ${pool<6?"disabled":""}>${n?"Reroll":"Surprise me"}</button>${n?`<button class="btn btn-line" onclick="setup.cats=[];save();render()">Clear</button>`:""}<small style="color:var(--muted)">Surprise draws from ${pool} categories. Tap the dice on any card to leave just that one out.</small></div>
    ${n?`<div class="picked">${setup.cats.map(id=>`<button onclick="toggleCat('${id}')" aria-label="Remove ${esc(CAT[id].name)}"><span class="badge" style="--gc:${CAT[id].color};width:28px;height:28px;border-radius:8px">${icon(id)}</span>${esc(CAT[id].name)}<span class="x">&times;</span></button>`).join("")}</div>`:""}
    <label class="search">${P(IC.search).replace("<svg","<svg class='ico'")}<input id="q-search" placeholder="Search ${BANK.length} categories" value="${esc(query)}" oninput="query=this.value;render()"></label>
    ${groups.map(g=>`<div class="grp" style="--gc:${g.color}"><h3><i></i>${g.name} <small>${g.ids.length}</small></h3><div class="cats">${g.ids.map(catCard).join("")}</div></div>`).join("")||`<p style="color:var(--muted)">No categories match "${esc(query)}".</p>`}
   </div>
   <div class="dock"><button class="btn btn-pri" ${n===6?"":"disabled"} onclick="go('draft')">${n===6?"Next: pick abilities":`Pick ${6-n} more`}</button></div>
  </div>`;
}
function addTeam(){setup.teams.push(["Team Dhow","Team Pearl"][setup.teams.length-2]||"Team");render()}
function toggleCat(id){const i=setup.cats.indexOf(id);if(i>-1)setup.cats.splice(i,1);else if(setup.cats.length<6)setup.cats.push(id);else toast("6 categories already picked");save();render()}
function toggleEx(id){const i=setup.excl.indexOf(id);if(i>-1)setup.excl.splice(i,1);else{setup.excl.push(id);const j=setup.cats.indexOf(id);if(j>-1)setup.cats.splice(j,1)}save();render()}
function randomCats(){const prev=new Set(setup.cats);let pool=BANK.map(c=>c.id).filter(id=>!setup.excl.includes(id));const fresh=pool.filter(id=>!prev.has(id));const src=fresh.length>=6?fresh:pool;setup.cats=src.sort(()=>Math.random()-.5).slice(0,6);save();render()}

function draftHTML(){
  const ok=setup.teams.every((t,i)=>(setup.abil[i]||[]).length===3);
  return `<div class="band"></div><div class="screen draft">
   <div class="top"><button class="btn btn-soft" onclick="go('setup')">Back</button><h2>Abilities</h2><span style="width:60px"></span></div>
   <p style="margin:0;color:var(--muted)">Each team picks one Help, one Points and one Tactics ability. Each ability works once per game.</p>
   ${setup.teams.map((t,i)=>{const mine=setup.abil[i]||[];return `<section class="dteam" style="--c:${COLORS[i]}"><header><div class="who"><img src="${ART["team-"+((setup.av[i]||0)%AVN)]}" alt=""><h3>${esc(t||"Team "+(i+1))}</h3></div><div style="display:flex;gap:8px;align-items:center"><b style="color:var(--c)">${mine.length}/3</b><button class="btn btn-line" onclick="randAb(${i})">Random 3</button></div></header>
    ${ABG.map((gn,g)=>`<div class="label">${gn}: pick 1</div><div class="abil">${AB.filter(a=>a.g===g).map(a=>{const on=mine.includes(a.id);return `<button class="ab ${on?"on":""}" onclick="togAb(${i},'${a.id}')"><span class="ai">${P(IC[a.ico])}</span><span><b>${a.name}</b><small>${a.desc}</small></span></button>`}).join("")}</div>`).join("")}</section>`}).join("")}
   <div class="dock"><button class="btn btn-pri" ${ok?"":"disabled"} onclick="startGame()">${ok?"Start game":"Each team needs 3 abilities"}</button></div></div>`;
}
function togAb(i,id){const g=ABM[id].g;let m=(setup.abil[i]||[]);if(m.includes(id))m=m.filter(x=>x!==id);else m=m.filter(x=>ABM[x].g!==g).concat(id);setup.abil[i]=m;save();render()}
function randAb(i){setup.abil[i]=ABG.map((_,g)=>{const l=AB.filter(a=>a.g===g);return l[Math.floor(Math.random()*l.length)].id});save();render()}

function startGame(){
  const used=store.get("mj2_used",{});
  const cats=setup.cats.map(id=>{const c=CAT[id];used[id]=used[id]||[];const tiles=[];
    [200,400,600].forEach(p=>{const all=c.questions.map((q,i)=>({q,i})).filter(o=>o.q.p===p);let pool=all.filter(o=>!used[id].includes(o.i));
      if(pool.length<2){used[id]=used[id].filter(i=>c.questions[i].p!==p);pool=all}
      pool.sort(()=>Math.random()-.5).slice(0,2).forEach(o=>{used[id].push(o.i);tiles.push({p,qi:o.i,by:null,done:false})})});
    return {id,tiles}});
  store.set("mj2_used",used);
  game={teams:setup.teams.map((n,i)=>({name:(n||"").trim()||`Team ${i+1}`,av:setup.av[i]||0,score:0,abil:[...(setup.abil[i]||[])],used:{},sabo:false})),cats,turn:0,timer:setup.timer,over:false,hist:[]};
  save();keepAwake();go("board");
}
const qOf=(ci,ti)=>{const t=game.cats[ci].tiles[ti];return CAT[game.cats[ci].id].questions[t.qi]};
const cur=()=>qOf(Q.ci,Q.ti);

function tileHTML(ci,ti){const x=game.cats[ci].tiles[ti];
  if(x.done)return x.by===null?`<div class="tile done miss">Missed</div>`:`<div class="tile done" style="--c:${COLORS[x.by]}">${esc(game.teams[x.by].name.slice(0,9))}</div>`;
  return `<button class="tile" onclick="openQ(${ci},${ti})" aria-label="${esc(CAT[game.cats[ci].id].name)} ${x.p}">${x.p}</button>`}
function boardHTML(){
  return `<div class="band"></div><div class="screen">
   <div class="top"><button class="btn btn-soft" onclick="go('home')">Menu</button><div class="turn" style="--c:${COLORS[game.turn]}">${avImg(game.teams[game.turn].av)}<span>${esc(game.teams[game.turn].name)} picks</span></div>
    <div style="display:flex;gap:8px"><button class="btn btn-line fs-btn" onclick="toggleFS()">Full screen</button>${game.hist.length?`<button class="btn btn-line" onclick="undo()">Undo</button>`:""}<button class="btn btn-line" onclick="confirmEnd()">End</button></div></div>
   <div class="board">${game.cats.map((c,ci)=>`<section class="card" style="--gc:${CAT[c.id].color}"><div class="col">${[0,2,4].map(t=>tileHTML(ci,t)).join("")}</div><div class="mid"><span class="badge">${icon(c.id)}</span><h3>${esc(CAT[c.id].name)}</h3></div><div class="col">${[1,3,5].map(t=>tileHTML(ci,t)).join("")}</div></section>`).join("")}</div>
  </div>
  <div class="rail"><div class="rail-in">${game.teams.map((t,i)=>`<div class="chip ${i===game.turn?"cur":""}" style="--c:${COLORS[i]}"><span class="cav">${avImg(t.av)}</span><span class="nm">${esc(t.name)}</span><span class="sc">${t.score}</span><div class="row"><button onclick="adj(${i},-100)" aria-label="Minus 100">-100</button><button class="abtn" onclick="teamSheet(${i})">${t.abil.filter(a=>!t.used[a]).length} abilities</button><button onclick="adj(${i},100)" aria-label="Plus 100">+100</button></div></div>`).join("")}</div></div>`;
}
function adj(i,v){game.teams[i].score+=v;save();render()}
function modal(html){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div>${html}</div>`;m.addEventListener("click",e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
function teamSheet(i){const t=game.teams[i];
  const m=modal(`<h3 style="font-size:22px;color:${COLORS[i]}">${esc(t.name)}</h3><p>Board abilities can be used here. Question abilities appear on the question screen.</p>
   <div style="display:flex;flex-direction:column;gap:8px">${t.abil.map(id=>{const a=ABM[id],u=t.used[id];return `<button class="ab ${u?"":"on"}" style="--c:${COLORS[i]}" ${u||a.when!=="board"?"disabled":""} data-ab="${id}"><span class="ai">${P(IC[a.ico])}</span><span><b>${a.name}${u?" (used)":a.when==="board"?"":" (on questions)"}</b><small>${a.desc}</small></span></button>`}).join("")}</div>
   <div class="row"><button class="btn btn-soft" data-close>Close</button></div>`);
  m.querySelector("[data-close]").onclick=()=>m.remove();
  m.querySelectorAll("[data-ab]").forEach(b=>b.onclick=()=>{const id=b.dataset.ab;m.remove();
    if(id==="turn"){t.used.turn=true;game.turn=i;save();render();toast(t.name+" takes the turn")}
    if(id==="sabo"){pickTeam(i,"Sabotage which team?",j=>{t.used.sabo=true;game.teams[j].sabo=true;save();render();toast(game.teams[j].name+" gets half time next question")})}
  });
}
function pickTeam(self,title,cb){const m=modal(`<h3 style="font-size:22px">${title}</h3><div class="award">${game.teams.map((t,j)=>j===self?"":`<button style="--c:${COLORS[j]}" data-j="${j}">${esc(t.name)}</button>`).join("")}</div><div class="row"><button class="btn btn-soft" data-close>Cancel</button></div>`);
  m.querySelector("[data-close]").onclick=()=>m.remove();m.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{m.remove();cb(+b.dataset.j)})}

function vidHTML(x){if(!x.yt)return "";const s=x.start||0,e=x.end||s+30,url=`https://www.youtube.com/watch?v=${x.yt}&t=${s}s`,aud=x.audio&&!(Q&&Q.revealed);
  if(ytBlocked)return aud?`<div class="aud-card"><span><b>Sound clip</b><small>Clips play inside the Majlis app. Here you can open it on YouTube, but the page shows the title, so let the host play it.</small></span></div><a class="vid-open" href="${url}" target="_blank" rel="noopener"><i></i><span><b>Host: play on YouTube</b><small>Starts at ${s}s, play until ${e}s.</small></span></a>`
    :`<a class="vid-open" href="${url}" target="_blank" rel="noopener"><i></i><span><b>Play the clip</b><small>Opens YouTube at ${s}s. Watch until ${e}s, then come back.</small></span></a>`;
  return `<div class="vid ${aud?"aud-mode":""}">${x.audio?`<div class="aud-card"><button class="aud-btn" id="audb" onclick="audPlay()" aria-label="Play or pause the sound clip">&#9654;</button><span><b>Listen to the clip</b><small>${e-s} seconds of sound. The video shows after the answer.</small></span><button class="aud-re" onclick="audPlay(true)">Replay</button></div>`:""}<iframe id="ytf" src="https://www.youtube-nocookie.com/embed/${x.yt}?start=${s}&end=${e}&rel=0&playsinline=1&fs=1&modestbranding=1&enablejsapi=1${location.protocol==="https:"?"&origin="+encodeURIComponent(location.origin):""}" referrerpolicy="strict-origin-when-cross-origin" title="Question clip" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe><a href="${url}" target="_blank" rel="noopener">Clip not playing? Open on YouTube</a></div>`}
let audOn=false;
function ytCmd(func,args){const f=$("#ytf");if(f&&f.contentWindow)f.contentWindow.postMessage(JSON.stringify({event:"command",func,args:args||[]}),"*")}
function audPlay(restart){const x=cur();if(restart){ytCmd("seekTo",[x.start||0,true]);ytCmd("playVideo");audOn=true}else{audOn=!audOn;ytCmd(audOn?"playVideo":"pauseVideo")}const b=$("#audb");if(b)b.innerHTML=audOn?"&#10074;&#10074;":"&#9654;"}
const WIKI={},WURL={};
function wikiImg(t){if(!WIKI[t])WIKI[t]=fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.replace(/ /g,"_"))).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||j.type==="disambiguation"||!j.thumbnail)return null;const o=j.originalimage,th=j.thumbnail.source;
    const u=o&&o.width<=1100&&!/\.svg$/i.test(o.source)?o.source:/\/\d+px-/.test(th)&&(!o||o.width>800)?th.replace(/\/\d+px-/,"/800px-"):th;return WURL[t]=u}).catch(()=>null);return WIKI[t]}
function wpicHTML(t,id){if(!t)return "";if(WURL[t])return `<div class="wpic"><img class="q-img" alt="" src="${esc(WURL[t])}" onerror="this.remove()"></div>`;
  return `<div class="wpic" id="${id}" data-t="${esc(t)}"></div>`}
function fillPics(){document.querySelectorAll(".wpic[data-t]").forEach(el=>{const t=el.dataset.t;el.removeAttribute("data-t");wikiImg(t).then(u=>{if(u&&el.isConnected)el.innerHTML=`<img class="q-img" alt="" src="${esc(u)}" onerror="this.remove()">`})})}
function mediaHTML(x){let h="";if(!x.img&&!x.svg&&!x.emoji&&!x.yt&&!x.pic)h+=`<img class="q-art" src="${ART["cat-"+game.cats[Q.ci].id]||""}" alt="">`;h+=wpicHTML(x.pic,"qpic");if(x.img)h+=`<img class="q-img" alt="Picture for this question" src="${esc(x.img)}">`;if(x.svg)h+=`<img class="q-img" alt="Picture for this question" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(x.svg)}">`;if(x.emoji)h+=`<div class="q-emoji">${esc(x.emoji)}</div>`;return h+`<div id="vidbox">${vidHTML(x)}</div>`}
function qText(x){let h=esc(x.q);(x.qar||[]).forEach(([t,a])=>{const e=esc(t),re=new RegExp("(^|[^\\p{L}\\p{N}])("+e.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![\\p{L}\\p{N}])","u"),m=re.exec(h);if(m){const k=m.index+m[1].length;h=h.slice(0,k)+e+` - <bdi class="arw" lang="ar">${esc(a)}</bdi>`+h.slice(k+e.length)}});return h}
function hintOf(a){return String(a).split(/\s+/).map(w=>w[0]+" _".repeat(Math.max(0,w.length-1))).join("   ")}

function openQ(ci,ti){
  const tt=game.teams[game.turn];let left=game.timer;
  if(tt.sabo){left=Math.ceil(game.timer/2);tt.sabo=false;save()}
  Q={ci,ti,left,total:left,revealed:false,team:game.turn,picker:game.turn,mult:1,risk:false,insure:false,pick:false,hint:false,two:false,room:false,freeze:0,paused:false,first:null,block:null,stealer:null,tried:[],active:{}};
  const el=document.createElement("div");el.className="q";el.id="qv";document.body.appendChild(el);document.body.style.overflow="hidden";
  buildQ();startTick();beep(660,.08);
}
function buildQ(){const c=CAT[game.cats[Q.ci].id],x=cur();
  $("#qv").innerHTML=`<div class="band"></div><div class="q-in"><div class="q-head" id="qhead"></div><div class="tags" id="qtags"></div>
   <div class="q-body"><div class="q-text">${qText(x)}</div>${mediaHTML(x)}<div id="qhint"></div><div id="qans"></div></div><div id="qfoot"></div></div>`;
  audOn=false;drawQ();fillPics();if(x.apic)wikiImg(x.apic)}
function drawQ(){
  const c=CAT[game.cats[Q.ci].id],x=cur(),tile=game.cats[Q.ci].tiles[Q.ti],t=game.teams[Q.team];
  const R=33,C=2*Math.PI*R,frac=Math.max(0,Q.left)/Q.total,low=Q.left<=10;
  $("#qhead").innerHTML=`<div class="q-meta"><span class="badge" style="--gc:${c.color};width:48px;height:48px">${icon(c.id)}</span><div style="min-width:0"><div class="label">${esc(c.name)}</div><div class="pts ${Q.mult>1?"hot":""}">${tile.p*Q.mult} pts${Q.mult>1?` (x${Q.mult})`:""}</div></div></div>
   ${Q.revealed?"":`<button class="ring ${low?"low":""}" onclick="pauseT()" aria-label="${Q.paused?"Resume":"Pause"} timer"><svg width="78" height="78" viewBox="0 0 78 78"><circle cx="39" cy="39" r="${R}" stroke="var(--s3)" stroke-width="7" fill="none"/><circle id="arc" cx="39" cy="39" r="${R}" stroke="${low?"var(--bad)":"var(--pri)"}" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg><b id="secs">${Math.max(0,Q.left)}</b><small id="tsub">${Q.freeze>0?"Frozen "+Q.freeze+"s":Q.paused?"Paused":"Tap to pause"}</small></button>`}`;
  const tags=[];
  tags.push(`<span style="--c:${COLORS[Q.team]}">Answering: <b>${esc(t.name)}</b></span>`);
  if(Q.two)tags.push(`<span class="tag-pill">Two guesses</span>`);if(Q.room)tags.push(`<span class="tag-pill">Ask the room: 15 sec</span>`);
  if(Q.insure)tags.push(`<span class="tag-pill">Insured</span>`);if(Q.pick)tags.push(`<span class="tag-pill">Pickpocket</span>`);if(Q.risk)tags.push(`<span class="tag-pill">Risk it</span>`);
  if(Q.stealer!==null)tags.push(`<span class="tag-pill" style="--c:${COLORS[Q.stealer]}">${esc(game.teams[Q.stealer].name)} is stealing</span>`);if(Q.first!==null)tags.push(`<span class="tag-pill">${esc(game.teams[Q.first].name)} steals first</span>`);if(Q.block!==null)tags.push(`<span class="tag-pill">${esc(game.teams[Q.block].name)} blocked</span>`);
  if(!Q.revealed&&Q.left<=0)tags.push(`<span style="color:var(--bad);font-weight:700">${Q.stealer===null?"Time is up. Others can steal.":"Time is up."}</span>`);
  $("#qtags").innerHTML=tags.join("");
  if(Q.revealed)setTimeout(fillPics);
  $("#qhint").innerHTML=Q.hint&&!Q.revealed?`<div class="hint" aria-label="Hint">${esc(hintOf(x.a))}</div>`:"";
  $("#qans").innerHTML=Q.revealed?`<div class="ans"><small>Answer</small><p>${esc(x.a)}${x.ar?` - <bdi class="arw" lang="ar">${esc(x.ar)}</bdi>`:""}</p>${x.alt&&x.alt.length?`<div class="alt">Also accepted: ${x.alt.map(esc).join(", ")}</div>`:""}${wpicHTML(x.apic,"apic")}</div>`:"";
  if(!Q.revealed){
    const rows=game.teams.map((tm,i)=>{const list=tm.abil.filter(id=>{const a=ABM[id];if(a.when!=="q")return false;if(a.who==="ans")return i===Q.team;if(a.who==="other")return i!==Q.team;return true});if(!list.length)return "";
      return `<div class="tm" style="--c:${COLORS[i]}"><span>${esc(tm.name)}</span>${list.map(id=>{const a=ABM[id],u=tm.used[id],dis=u||(["double","risk"].includes(id)&&Q.mult>1);return `<button class="use ${Q.active[i+id]?"active":""}" style="--c:${COLORS[i]}" ${dis?"disabled":""} onclick="useAb(${i},'${id}')" title="${esc(a.desc)}">${P(IC[a.ico])}${a.name}</button>`}).join("")}</div>`}).join("");
    $("#qfoot").innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">${rows?`<div class="abrow">${rows}</div>`:""}${stealHTML()}<div class="q-acts"><button class="btn btn-soft" onclick="closeQ(false)">Back</button><button class="btn btn-pri" onclick="reveal()">Show answer</button></div></div>`;
  }else{
    $("#qfoot").innerHTML=`<div><div class="label" style="margin-bottom:10px">Who got it right?</div><div class="award">${game.teams.map((tm,i)=>{const blocked=Q.block===i&&i!==Q.team;return `<button class="${Q.stealer===i?"hl":""}" style="--c:${COLORS[i]}" ${blocked?"disabled":""} onclick="award(${i})">${esc(tm.name)}<small>${i===Q.team?"+"+tile.p*Q.mult+(Q.pick?" & pickpocket":""):blocked?"Blocked":"Steal +"+tile.p}</small></button>`}).join("")}<button class="none" onclick="award(null)">No one<small>${Q.risk?"-"+tile.p+" for "+esc(t.name):Q.insure?"+"+tile.p/2+" insurance":"Tile is lost"}</small></button></div></div>`;
  }
}
function setArc(){const R=33,C=2*Math.PI*R,arc=$("#arc"),s=$("#secs"),sub=$("#tsub");if(arc){arc.setAttribute("stroke-dashoffset",C*(1-Math.max(0,Q.left)/Q.total));if(Q.left<=10){arc.setAttribute("stroke","var(--bad)");$(".ring").classList.add("low")}}if(s)s.textContent=Math.max(0,Q.left);if(sub)sub.textContent=Q.freeze>0?"Frozen "+Q.freeze+"s":Q.paused?"Paused":"Tap to pause"}
function startTick(){clearInterval(tick);tick=setInterval(()=>{if(!Q||Q.revealed){clearInterval(tick);return}if(Q.paused||Q.left<=0)return;
  if(Q.freeze>0){Q.freeze--;setArc();return}
  Q.left--;if(Q.left<=5&&Q.left>0)beep(990,.07);
  if(Q.left===0){beep(220,.5);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}drawQ();return}setArc()},1000)}
function pauseT(){if(!Q||Q.revealed)return;Q.paused=!Q.paused;setArc()}
function freshQ(ci,p){const id=game.cats[ci].id,c=CAT[id],inUse=new Set(game.cats[ci].tiles.map(t=>t.qi)),used=store.get("mj2_used",{});used[id]=used[id]||[];
  let pool=c.questions.map((q,i)=>({q,i})).filter(o=>o.q.p===p&&!inUse.has(o.i)&&!used[id].includes(o.i));
  if(!pool.length)pool=c.questions.map((q,i)=>({q,i})).filter(o=>o.q.p===p&&!inUse.has(o.i));
  if(!pool.length)return null;const pick=pool[Math.floor(Math.random()*pool.length)];used[id].push(pick.i);store.set("mj2_used",used);return pick.i}
function useAb(i,id){const tm=game.teams[i];if(tm.used[id])return;const tile=game.cats[Q.ci].tiles[Q.ti];
  const done=()=>{tm.used[id]=true;Q.active[i+id]=true;save();drawQ();beep(1200,.1)};
  switch(id){
   case"time":Q.left+=45;Q.total+=45;done();break;
   case"double":Q.mult=2;done();break;
   case"risk":Q.mult=3;Q.risk=true;done();break;
   case"swap":case"ease":{const qi=freshQ(Q.ci,id==="ease"?200:tile.p);if(qi===null){toast("No other question available");return}tile.qi=qi;tm.used[id]=true;save();buildQ();toast(id==="ease"?"Easier question, same points":"New question");break}
   case"hint":Q.hint=true;done();break;
   case"two":Q.two=true;done();break;
   case"room":Q.room=true;done();break;
   case"insure":Q.insure=true;done();break;
   case"pick":Q.pick=true;done();break;
   case"freeze":Q.freeze=20;done();break;
   case"first":Q.first=i;done();break;
   case"pass":pickTeam(i,"Pass this question to which team?",j=>{Q.team=j;tm.used.pass=true;save();drawQ();toast(game.teams[j].name+" must answer")});break;
   case"block":pickTeam(i,"Block which team from stealing?",j=>{Q.block=j;tm.used.block=true;save();drawQ()});break;
  }}
function stealHTML(){if(game.teams.length<2)return "";const others=game.teams.map((t,i)=>i).filter(i=>i!==Q.team);
  const firstWaiting=Q.first!==null&&Q.first!==Q.team&&!Q.tried.includes(Q.first);
  return `<div class="steal"><span class="label">${Q.stealer===null?"Missed it? Another team can steal":"Stealing now"}</span><div class="steal-row">${others.map(i=>{const tm=game.teams[i],blocked=Q.block===i,wait=firstWaiting&&i!==Q.first,on=Q.stealer===i;
    return `<button class="steal-b ${on?"on":""}" style="--c:${COLORS[i]}" ${blocked||wait||on?"disabled":""} onclick="steal(${i})"><img src="${ART["team-"+((tm.av||0)%AVN)]}" alt=""><span>${esc(tm.name)}<small>${blocked?"Blocked":wait?"Waits for "+esc(game.teams[Q.first].name):on?"Answering now":"Steal for +"+game.cats[Q.ci].tiles[Q.ti].p}</small></span></button>`}).join("")}</div></div>`}
function steal(i){Q.stealer=i;if(!Q.tried.includes(i))Q.tried.push(i);Q.left=Math.max(15,Math.min(Q.left,15));Q.total=15;Q.paused=false;Q.freeze=0;startTick();drawQ();beep(880,.12);toast(game.teams[i].name+" is stealing: 15 seconds")}
function reveal(){Q.revealed=true;const vb=$("#vidbox .aud-mode");if(vb)vb.classList.remove("aud-mode");else if(cur().audio&&ytBlocked)$("#vidbox").innerHTML=vidHTML(cur());clearInterval(tick);drawQ();beep(520,.15)}
function award(i){
  const tile=game.cats[Q.ci].tiles[Q.ti],ans=game.teams[Q.team];
  game.hist.push({ci:Q.ci,ti:Q.ti,teams:JSON.parse(JSON.stringify(game.teams)),turn:game.turn});if(game.hist.length>20)game.hist.shift();
  if(i===Q.team){ans.score+=tile.p*Q.mult;
    if(Q.pick){const rivals=game.teams.map((t,j)=>({t,j})).filter(o=>o.j!==i).sort((a,b)=>b.t.score-a.t.score);if(rivals.length){const take=Math.min(tile.p/2,Math.max(0,rivals[0].t.score));rivals[0].t.score-=take;ans.score+=take}}
    beep(1320,.2)}
  else{if(i!==null){game.teams[i].score+=tile.p;beep(1320,.2)}if(Q.risk)ans.score-=tile.p;if(Q.insure)ans.score+=tile.p/2}
  tile.done=true;tile.by=i;game.turn=(Q.picker+1)%game.teams.length;
  closeQ(true);
  if(game.cats.every(c=>c.tiles.every(t=>t.done))){game.over=true;save();go("end")}
}
function undo(){const h=game.hist.pop();if(!h)return;game.teams=h.teams;game.turn=h.turn;const t=game.cats[h.ci].tiles[h.ti];t.done=false;t.by=null;save();render();toast("Last result undone")}
function closeQ(s){clearInterval(tick);const el=$("#qv");if(el)el.remove();document.body.style.overflow="";Q=null;if(s)save();render()}
function confirmEnd(){const m=modal(`<h3 style="font-size:24px">End this game?</h3><p>The current scores decide the winner.</p><div class="row"><button class="btn btn-soft" data-no>Keep playing</button><button class="btn btn-pri" data-yes>End game</button></div>`);
  m.querySelector("[data-no]").onclick=()=>m.remove();m.querySelector("[data-yes]").onclick=()=>{m.remove();game.over=true;save();go("end")}}
function endHTML(){const order=game.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score),tie=order.length>1&&order[0].score===order[1].score;setTimeout(confetti,50);
  return `<div class="band"></div><div class="screen end"><span class="label">Final scores</span><h1>${tie?"It's a tie":esc(order[0].name)+" wins"}</h1>
   <div class="rank">${order.map((t,k)=>`<div style="--c:${COLORS[t.i]}"><span>${k+1}. ${esc(t.name)}</span><span>${t.score}</span></div>`).join("")}</div>
   <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="btn btn-pri" onclick="go('draft')">Rematch</button><button class="btn btn-soft" onclick="go('setup')">Change setup</button></div></div>`}
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const b=document.createElement("div");b.className="confetti";const cs=getComputedStyle(document.documentElement),cols=["--t1","--t2","--t3","--t4"].map(v=>cs.getPropertyValue(v));for(let k=0;k<80;k++){const i=document.createElement("i");i.style.left=Math.random()*100+"%";i.style.background=cols[k%4];i.style.animationDuration=(2+Math.random()*2.5)+"s";i.style.animationDelay=Math.random()*.8+"s";b.appendChild(i)}document.body.appendChild(b);setTimeout(()=>b.remove(),5200)}
function go(v){view=v;if(v!=="setup")query="";render();window.scrollTo(0,0)}
window.onAndroidBack=function(){const m=document.querySelector(".modal");if(m){m.remove();return true}if(Q){closeQ(false);return true}if(view==="draft"){go("setup");return true}if(view==="setup"||view==="board"||view==="end"){go("home");return true}return false};
applySkin();render();
</script>
