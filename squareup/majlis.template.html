<title>Majlis</title>
<meta name="theme-color" content="#1A0F0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Majlis">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Readex+Pro:wght@400;500;700&display=swap">
<style>
/* Layout: a woven Al Sadu band frames every screen. Board = category "cushions" with a 200/400/600 column on each side, scores in a bottom rail, questions take the full screen. */
:root{
  --bg:#1A0F0D; --s1:#26160F; --s2:#342017; --s3:#45291D; --line:#563526;
  --red:#C8352E; --ochre:#E6A23C; --ivory:#F5ECDD; --muted:#C2A992; --green:#3A9D6F;
  --t1:#E6A23C; --t2:#C8352E; --t3:#3A9D6F; --t4:#F5ECDD;
  --display:"Reem Kufi","Trebuchet MS",system-ui,sans-serif;
  --body:"Readex Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ivory);font-family:var(--body);font-size:16px;margin:0;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(120% 60% at 50% -10%,#3a1d14 0,transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.3px}
.screen{min-height:100%;padding-inline:16px;padding-block:0 130px;max-width:1180px;margin:0 auto;box-sizing:border-box}
.sadu{height:16px;background-color:var(--ivory);
  background-image:linear-gradient(135deg,var(--red) 25%,transparent 25%),linear-gradient(225deg,var(--red) 25%,transparent 25%),linear-gradient(315deg,var(--bg) 25%,transparent 25%),linear-gradient(45deg,var(--bg) 25%,transparent 25%);
  background-size:16px 16px;background-position:-8px 0,-8px 0,0 0,0 0;border-block:3px solid var(--red)}
.sadu.thin{height:8px;background-size:8px 8px;background-position:-4px 0,-4px 0,0 0,0 0;border-block-width:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:12px;font-weight:700;font-size:16px;transition:transform .1s,filter .1s}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--red);color:var(--ivory);box-shadow:0 4px 0 #7d1c17}
.btn-gold{background:var(--ochre);color:#2b1606;box-shadow:0 4px 0 #9b6a1f}
.btn-ghost{background:var(--s2);color:var(--ivory);box-shadow:0 4px 0 #160c09;border:1px solid var(--line)}
.btn-line{color:var(--muted);border:1px solid var(--line);padding:10px 16px}
.btn[disabled]{opacity:.4;pointer-events:none}
.label{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.top h2{font-size:28px}

/* Home */
.home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px;padding-top:7vh}
.mark{font-family:var(--display);font-weight:700;font-size:clamp(64px,17vw,120px);line-height:.9;color:var(--ivory)}
.mark span{color:var(--ochre)}
.tag{color:var(--muted);max-width:36ch;line-height:1.55;margin:0}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stats div{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-align:left}
.stats b{display:block;font-family:var(--display);font-size:26px;color:var(--ochre);font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:13px}
.home .acts{display:flex;flex-direction:column;gap:14px;width:min(340px,100%)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:min(820px,100%);text-align:left;margin-top:10px}
.rules div{border-top:3px solid var(--red);background:var(--s1);border-radius:0 0 12px 12px;padding:14px}
.rules b{font-family:var(--display);font-size:19px;display:block}
.rules small{color:var(--muted);display:block;margin-top:4px;line-height:1.45}

/* Setup */
.setup{display:flex;flex-direction:column;gap:30px}
.sec{display:flex;flex-direction:column;gap:12px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.team-in{display:flex;align-items:center;gap:10px;background:var(--s1);border-radius:12px;padding:8px 12px;border:1px solid var(--line);border-left:6px solid var(--c)}
.team-in input{flex:1;min-width:0;background:none;border:0;color:var(--ivory);font:500 17px var(--body);padding:8px 0}
.team-in button{color:var(--muted);font-size:24px;line-height:1;padding:4px 8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:10px 16px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-weight:700}
.seg button.on{background:var(--ochre);color:#2b1606;border-color:var(--ochre)}
.grp{display:flex;flex-direction:column;gap:10px}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.grp-h h3{font-size:20px}
.grp-h button{font-size:13px;color:var(--muted);font-weight:500;padding:6px 8px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cat{position:relative;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--s1);border:1px solid var(--line);text-align:left;min-height:64px}
.cat .mono{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;background:var(--gc);color:#22120a}
.cat .nm{font-weight:500;font-size:15px;line-height:1.2;min-width:0}
.cat .nm small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.cat.on{border-color:var(--ochre);background:var(--s3);box-shadow:inset 0 0 0 1px var(--ochre)}
.cat.on::after{content:attr(data-n);position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--ochre);color:#2b1606;display:grid;place-items:center;font-weight:700;font-size:13px}
.cat.ex .nm small{color:var(--red)}
.exbtn{position:absolute;bottom:4px;right:4px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.exbtn svg{width:18px;height:18px}
.cat.ex .exbtn{color:var(--red)}
.counter{font-weight:700;color:var(--ochre)}
.surprise{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.surprise small{color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);display:flex;justify-content:center;z-index:5}
.dock .btn{width:min(420px,100%)}

/* Board */
.turn{display:flex;align-items:center;gap:10px;font-weight:700;background:var(--s1);border:1px solid var(--line);padding:8px 14px;border-radius:999px;min-width:0}
.turn i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.turn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.cushion{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px;position:relative;overflow:hidden}
.cushion::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--gc)}
.col{display:flex;flex-direction:column;gap:8px}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:8px 2px}
.mid .mono{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:21px;background:var(--gc);color:#22120a}
.mid h3{font-size:17px;line-height:1.15}
.tile{font-family:var(--display);font-weight:700;font-size:21px;height:46px;border-radius:10px;background:var(--s3);color:var(--ochre);box-shadow:0 3px 0 #120a07;font-variant-numeric:tabular-nums;transition:transform .1s}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 #120a07}
.tile.done{box-shadow:none;pointer-events:none;font-size:11px;font-family:var(--body);font-weight:700;display:grid;place-items:center;color:#22120a;background:var(--c);opacity:.9}
.tile.miss{background:transparent;border:1px dashed var(--line);color:var(--line)}
.rail{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(26,15,13,.96);backdrop-filter:blur(8px)}
.rail-in{display:flex;gap:8px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.chip{flex:1;max-width:250px;min-width:0;border-radius:12px;padding:8px 8px 6px;background:var(--s1);border:1px solid var(--line);border-top:4px solid var(--c);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.chip.cur{background:var(--s3);box-shadow:0 0 0 2px var(--c)}
.chip .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip .sc{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.chip .row{display:flex;gap:6px;align-items:center}
.chip .row button{font-size:11px;font-weight:700;color:var(--muted);padding:2px 7px;border-radius:7px;background:var(--s2)}
.dots{display:flex;gap:3px}
.dots b{width:7px;height:7px;border-radius:2px;background:var(--c);transform:rotate(45deg)}
.dots b.used{background:var(--line)}

/* Question */
.q{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
.q-in{max-width:880px;width:100%;margin:0 auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;flex:1;box-sizing:border-box}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.q-meta{display:flex;align-items:center;gap:12px;min-width:0}
.q-meta .mono{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:19px;background:var(--gc);color:#22120a;flex:none}
.pts{font-family:var(--display);font-weight:700;font-size:28px;color:var(--ochre);font-variant-numeric:tabular-nums;line-height:1.1}
.pts.x2{color:var(--red)}
.ring{position:relative;width:78px;height:78px;flex:none;border-radius:50%}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.ring small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.ring.low b{color:var(--red)}
.who-now{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.who-now b{color:var(--c)}
.q-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px}
.q-text{font-size:clamp(22px,4.6vw,38px);font-weight:700;line-height:1.3;text-wrap:balance}
.vid{display:flex;flex-direction:column;gap:8px}
.vid iframe{width:100%;aspect-ratio:16/9;max-width:100%;border:0;border-radius:14px;background:#000}
.vid a{color:var(--ochre);font-weight:700;font-size:14px}
.vid-open{display:flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ivory)}
.vid-open i{width:46px;height:46px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none}
.vid-open i::after{content:"";border-left:14px solid var(--ivory);border-block:9px solid transparent;margin-left:4px}
.vid-open small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.ans{background:var(--ivory);color:#22120a;border-radius:14px;overflow:hidden;animation:pop .3s ease}
.ans .sadu{border:0}
.ans div{padding:14px 18px 18px}
.ans small{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--red)}
.ans p{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,42px);line-height:1.1;margin:4px 0 0}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.aids{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.aid{padding:10px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-weight:700;font-size:14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.aid small{font-weight:400;color:var(--muted);font-size:12px}
.aid.active{border-color:var(--red);background:#3d1a15}
.aid[disabled]{opacity:.35;pointer-events:none}
.q-acts{display:flex;gap:10px}
.q-acts .btn-primary{flex:1}
.award{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.award button{padding:16px 10px;border-radius:12px;font-weight:700;font-size:16px;background:var(--c);color:#22120a;box-shadow:0 4px 0 rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.award button.none{background:var(--s2);color:var(--ivory);border:1px solid var(--line)}
.timeup{color:var(--red);font-weight:700}

/* End */
.end{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;padding-top:6vh}
.end h1{font-size:clamp(40px,10vw,72px);color:var(--ochre)}
.rank{width:min(480px,100%);display:flex;flex-direction:column;gap:10px}
.rank div{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:12px;background:var(--s1);border:1px solid var(--line);border-left:6px solid var(--c);font-weight:700}
.rank div span:last-child{font-family:var(--display);font-size:26px}
.rank div.first{background:var(--s3)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:12px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.modal{position:fixed;inset:0;background:rgba(10,5,4,.82);z-index:40;display:grid;place-items:center;padding:16px}
.modal>div{background:var(--s1);border-radius:16px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal p{margin:0;color:var(--muted)}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:420px){.board{grid-template-columns:1fr}.cushion{grid-template-columns:56px 1fr 56px}.tile{font-size:19px;height:42px}.chip .sc{font-size:22px}.aids{grid-template-columns:1fr 1fr 1fr}.aid small{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
const BANK=__DATA__;
const GROUPS=[
 {name:"UAE",color:"#C8352E",ids:["uaehistory","heritage","abudhabi","dubai","uaenature","uaefastfood"]},
 {name:"Gaming",color:"#3A9D6F",ids:["videogames","gaminghistory","tga","warcraft","pokemon"]},
 {name:"Anime",color:"#D96A8B",ids:["anime","onepiece","jjk"]},
 {name:"Screen & Music",color:"#7E8CE0",ids:["movies","oscars","sitcoms","superheroes","music","rap90s"]},
 {name:"Sports & Motors",color:"#4FB3C9",ids:["soccer","worldcup","f1","padel","sports","cars"]},
 {name:"Knowledge",color:"#E6A23C",ids:["general","geography","history","arabworld","japan","science","math","gcse","food","brands","riddles"]}
];
const MONO={uaehistory:"UH",heritage:"CH",abudhabi:"AD",dubai:"DX",uaenature:"NA",uaefastfood:"FF",videogames:"VG",gaminghistory:"GH",tga:"GA",warcraft:"WC",pokemon:"PK",anime:"AN",onepiece:"OP",jjk:"JK",movies:"MV",oscars:"OS",sitcoms:"SC",superheroes:"SH",music:"MU",rap90s:"90",soccer:"FB",worldcup:"WC",f1:"F1",padel:"PD",sports:"SP",cars:"CR",general:"GK",geography:"GE",history:"HI",arabworld:"AW",japan:"JP",science:"SC",math:"MA",gcse:"GC",food:"FD",brands:"BR",riddles:"RD"};
const CAT={};BANK.forEach(c=>{CAT[c.id]=c});GROUPS.forEach(g=>g.ids.forEach(id=>{if(CAT[id])CAT[id].color=g.color}));
const COLORS=["var(--t1)","var(--t2)","var(--t3)","var(--t4)"];
const AIDS=[{id:"double",name:"Double",desc:"x2 if correct"},{id:"time",name:"+30 sec",desc:"Extra time"},{id:"two",name:"Two Guesses",desc:"Say two answers"}];
const DICE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/></svg>';
const DICE_X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M3 21L21 3"/></svg>';

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let setup=store.get("mj_setup",{teams:["Team Falcon","Team Oryx"],cats:[],timer:60,excl:[]});
if(!setup.excl)setup.excl=[];
setup.cats=setup.cats.filter(id=>CAT[id]);
let game=store.get("mj_game",null);
let view=game&&!game.over?"board":"home";
let Q=null,tick=null,actx=null,ytBlocked=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{store.set("mj_game",game);store.set("mj_setup",setup)};
const mono=id=>MONO[id]||CAT[id].name.slice(0,2).toUpperCase();

document.addEventListener("securitypolicyviolation",e=>{if(String(e.blockedURI).includes("youtube")){ytBlocked=true;const f=$("#ytf");if(f&&Q){f.parentElement.outerHTML=vidHTML(game.cats[Q.ci].tiles[Q.ti])}}});

function beep(f=880,d=.12){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.16,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}

function render(){const a=$("#app");a.innerHTML=view==="home"?homeHTML():view==="setup"?setupHTML():view==="board"?boardHTML():endHTML();window.scrollTo(0,0)}

function homeHTML(){
  const total=BANK.reduce((n,c)=>n+c.questions.length,0),vids=BANK.reduce((n,c)=>n+c.questions.filter(q=>q.yt).length,0);
  const resume=game&&!game.over;
  return `<div class="sadu"></div><div class="screen"><div class="home">
   <div class="mark">Maj<span>lis</span></div>
   <p class="tag">Team trivia for nights in the majlis. Pick six categories, take turns, and chase the 600s.</p>
   <div class="stats"><div><b>${BANK.length}</b><small>categories</small></div><div><b>${total.toLocaleString()}</b><small>questions</small></div><div><b>${vids}</b><small>video clips</small></div></div>
   <div class="acts">${resume?`<button class="btn btn-gold" onclick="go('board')">Resume game</button>`:""}<button class="btn btn-primary" onclick="go('setup')">New game</button></div>
   <div class="rules">
    <div><b>2 to 4 teams</b><small>One phone, one host. Pass it around or cast it to the TV.</small></div>
    <div><b>6 categories</b><small>Each has a 200, 400 and 600 on both sides of the board.</small></div>
    <div><b>3 helpers each</b><small>Double, +30 sec and Two Guesses, once per game.</small></div>
    <div><b>Steal the points</b><small>If the team on turn misses, anyone can answer.</small></div>
   </div></div></div>`;
}

function setupHTML(){
  const n=setup.cats.length,pool=BANK.filter(c=>!setup.excl.includes(c.id)).length;
  return `<div class="sadu thin"></div><div class="screen setup">
   <div class="top"><button class="btn btn-ghost" onclick="go('home')">Back</button><h2>New game</h2><span style="width:70px"></span></div>
   <div class="sec"><span class="label">Teams</span>
    <div class="teams">${setup.teams.map((t,i)=>`<label class="team-in" style="--c:${COLORS[i]}"><input id="team${i}" value="${esc(t)}" maxlength="18" aria-label="Team ${i+1} name" oninput="setup.teams[${i}]=this.value;save()">${setup.teams.length>2?`<button onclick="setup.teams.splice(${i},1);render()" aria-label="Remove team">&times;</button>`:""}</label>`).join("")}</div>
    ${setup.teams.length<4?`<div><button class="btn btn-line" onclick="addTeam()">Add team</button></div>`:""}
   </div>
   <div class="sec"><span class="label">Answer timer</span>
    <div class="seg">${[30,45,60,90].map(s=>`<button class="${setup.timer===s?"on":""}" onclick="setup.timer=${s};render()">${s} sec</button>`).join("")}</div>
   </div>
   <div class="sec">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><span class="label">Categories</span><span class="counter">${n} of 6</span></div>
    <div class="surprise"><button class="btn btn-gold" onclick="randomCats()" ${pool<6?"disabled":""}>Surprise me</button><small>Picks from ${pool} categories. Tap the dice on a card to leave it out.</small></div>
    ${GROUPS.map(g=>{const ids=g.ids.filter(id=>CAT[id]);const allEx=ids.every(id=>setup.excl.includes(id));return `<div class="grp"><div class="grp-h"><h3>${g.name}</h3><button onclick="groupEx('${g.name}',${!allEx})">${allEx?"Include group in Surprise":"Exclude group from Surprise"}</button></div>
     <div class="cats">${ids.map(id=>{const c=CAT[id],idx=setup.cats.indexOf(id),ex=setup.excl.includes(id);return `<div class="cat ${idx>-1?"on":""} ${ex?"ex":""}" data-n="${idx+1}" style="--gc:${c.color}"><button style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;padding-right:24px" onclick="toggleCat('${id}')"><span class="mono">${mono(id)}</span><span class="nm">${esc(c.name)}<small>${ex?"Not in Surprise":c.questions.length+" questions"}</small></span></button><button class="exbtn" onclick="toggleEx('${id}')" aria-label="${ex?"Include in":"Exclude from"} Surprise">${ex?DICE_X:DICE}</button></div>`}).join("")}</div></div>`}).join("")}
   </div>
   <div class="dock"><button class="btn btn-primary" ${n===6?"":"disabled"} onclick="startGame()">${n===6?"Start game":`Pick ${6-n} more`}</button></div>
  </div>`;
}
function addTeam(){setup.teams.push(["Team Dhow","Team Pearl"][setup.teams.length-2]||"Team");render()}
function toggleCat(id){const i=setup.cats.indexOf(id);if(i>-1)setup.cats.splice(i,1);else if(setup.cats.length<6)setup.cats.push(id);save();render()}
function toggleEx(id){const i=setup.excl.indexOf(id);if(i>-1)setup.excl.splice(i,1);else setup.excl.push(id);save();render()}
function groupEx(name,ex){const g=GROUPS.find(x=>x.name===name);g.ids.forEach(id=>{const i=setup.excl.indexOf(id);if(ex&&i<0)setup.excl.push(id);if(!ex&&i>-1)setup.excl.splice(i,1)});save();render()}
function randomCats(){setup.cats=BANK.map(c=>c.id).filter(id=>!setup.excl.includes(id)).sort(()=>Math.random()-.5).slice(0,6);save();render()}

function startGame(){
  const used=store.get("mj_used",{});
  const cats=setup.cats.map(id=>{
    const c=CAT[id];used[id]=used[id]||[];const tiles=[];
    [200,400,600].forEach(p=>{
      const all=c.questions.map((q,i)=>({q,i})).filter(o=>o.q.p===p);
      let pool=all.filter(o=>!used[id].includes(o.i));
      if(pool.length<2){used[id]=used[id].filter(i=>c.questions[i].p!==p);pool=all}
      pool.sort(()=>Math.random()-.5).slice(0,2).forEach(o=>{used[id].push(o.i);tiles.push({...o.q,by:null,done:false})});
    });
    return {id,tiles};
  });
  store.set("mj_used",used);
  game={teams:setup.teams.map((n,i)=>({name:n.trim()||`Team ${i+1}`,score:0,aids:{double:false,time:false,two:false}})),cats,turn:0,timer:setup.timer,over:false};
  save();go("board");
}

function tileHTML(ci,ti){const x=game.cats[ci].tiles[ti];
  if(x.done)return x.by===null?`<div class="tile done miss">Missed</div>`:`<div class="tile done" style="--c:${COLORS[x.by]}">${esc(game.teams[x.by].name.slice(0,9))}</div>`;
  return `<button class="tile" onclick="openQ(${ci},${ti})" aria-label="${esc(CAT[game.cats[ci].id].name)} ${x.p}">${x.p}</button>`}
function boardHTML(){
  return `<div class="sadu thin"></div><div class="screen">
   <div class="top"><button class="btn btn-ghost" onclick="go('home')">Menu</button>
    <div class="turn" style="--c:${COLORS[game.turn]}"><i></i><span>${esc(game.teams[game.turn].name)} picks</span></div>
    <button class="btn btn-line" onclick="confirmEnd()">End</button></div>
   <div class="board">${game.cats.map((c,ci)=>`<section class="cushion" style="--gc:${CAT[c.id].color}">
     <div class="col">${[0,2,4].map(t=>tileHTML(ci,t)).join("")}</div>
     <div class="mid"><span class="mono">${mono(c.id)}</span><h3>${esc(CAT[c.id].name)}</h3></div>
     <div class="col">${[1,3,5].map(t=>tileHTML(ci,t)).join("")}</div></section>`).join("")}</div>
   </div>
   <div class="rail"><div class="sadu thin"></div><div class="rail-in">${game.teams.map((t,i)=>`<div class="chip ${i===game.turn?"cur":""}" style="--c:${COLORS[i]}"><span class="nm">${esc(t.name)}</span><span class="sc">${t.score}</span><div class="row"><button onclick="adj(${i},-100)" aria-label="Minus 100">-100</button><div class="dots" aria-label="Helpers left">${AIDS.map(a=>`<b class="${t.aids[a.id]?"used":""}"></b>`).join("")}</div><button onclick="adj(${i},100)" aria-label="Plus 100">+100</button></div></div>`).join("")}</div></div>`;
}
function adj(i,v){game.teams[i].score+=v;save();render()}

function vidHTML(x){
  if(!x.yt)return "";
  const s=x.start||0,e=x.end||s+30,url=`https://www.youtube.com/watch?v=${x.yt}&t=${s}s`;
  if(ytBlocked)return `<div class="vid"><a class="vid-open" href="${url}" target="_blank" rel="noopener"><i></i><span><b>Play the clip</b><small>Opens YouTube at ${s}s. Watch until ${e}s, then come back.</small></span></a></div>`;
  return `<div class="vid"><iframe id="ytf" src="https://www.youtube-nocookie.com/embed/${x.yt}?start=${s}&end=${e}&rel=0&playsinline=1" title="Question clip" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe><a href="${url}" target="_blank" rel="noopener">Clip not playing? Open on YouTube (${s}s to ${e}s)</a></div>`;
}
function openQ(ci,ti){
  Q={ci,ti,left:game.timer,extra:0,revealed:false,double:false,two:false,paused:false,team:game.turn};
  const el=document.createElement("div");el.className="q";el.id="qv";
  const x=game.cats[ci].tiles[ti],c=CAT[game.cats[ci].id];
  el.innerHTML=`<div class="sadu thin"></div><div class="q-in" style="--gc:${c.color}">
    <div class="q-head" id="qhead"></div>
    <div class="who-now" id="qwho"></div>
    <div class="q-body"><div class="q-text">${esc(x.q)}</div><div id="vidbox">${vidHTML(x)}</div><div id="qans"></div></div>
    <div id="qfoot"></div></div>`;
  document.body.appendChild(el);document.body.style.overflow="hidden";
  drawQ();startTick();beep(660,.08);
}
function total(){return game.timer+Q.extra}
function drawQ(){
  const c=CAT[game.cats[Q.ci].id],x=game.cats[Q.ci].tiles[Q.ti],t=game.teams[Q.team];
  const R=33,C=2*Math.PI*R,frac=Math.max(0,Q.left)/total(),low=Q.left<=10;
  $("#qhead").innerHTML=`<div class="q-meta"><span class="mono">${mono(c.id)}</span><div style="min-width:0"><div class="label">${esc(c.name)}</div><div class="pts ${Q.double?"x2":""}">${Q.double?x.p*2+" pts, doubled":x.p+" pts"}</div></div></div>
    <button class="ring ${low?"low":""}" onclick="pauseT()" aria-label="${Q.paused?"Resume":"Pause"} timer"><svg width="78" height="78" viewBox="0 0 78 78"><circle cx="39" cy="39" r="${R}" stroke="var(--s3)" stroke-width="7" fill="none"/><circle id="arc" cx="39" cy="39" r="${R}" stroke="${low?"var(--red)":"var(--ochre)"}" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg><b id="secs">${Q.revealed?"":Math.max(0,Q.left)}</b>${Q.revealed?"":`<small>${Q.paused?"Paused":"Tap to pause"}</small>`}</button>`;
  $("#qwho").innerHTML=`<span style="--c:${COLORS[Q.team]}">Answering: <b>${esc(t.name)}</b></span>${Q.two?"<span>&middot; two guesses allowed</span>":""}${!Q.revealed&&Q.left<=0?`<span class="timeup">&middot; Time is up, others can steal</span>`:""}`;
  $("#qans").innerHTML=Q.revealed?`<div class="ans"><div class="sadu thin"></div><div><small>Answer</small><p>${esc(x.a)}</p></div></div>`:"";
  $("#qfoot").innerHTML=!Q.revealed?`<div style="display:flex;flex-direction:column;gap:12px"><div class="aids">${AIDS.map(a=>{const on=(a.id==="double"&&Q.double)||(a.id==="two"&&Q.two);return `<button class="aid ${on?"active":""}" ${t.aids[a.id]?"disabled":""} onclick="useAid('${a.id}')">${a.name}<small>${t.aids[a.id]?(on?"Active":"Used"):a.desc}</small></button>`}).join("")}</div>
     <div class="q-acts"><button class="btn btn-ghost" onclick="closeQ(false)">Back</button><button class="btn btn-primary" onclick="reveal()">Show answer</button></div></div>`
    :`<div><div class="label" style="margin-bottom:10px">Who got it right?</div><div class="award">${game.teams.map((tm,i)=>`<button style="--c:${COLORS[i]}" onclick="award(${i})">${esc(tm.name)}${Q.double&&i===Q.team?" x2":""}</button>`).join("")}<button class="none" onclick="award(null)">No one</button></div></div>`;
}
function startTick(){clearInterval(tick);tick=setInterval(()=>{
  if(!Q||Q.revealed){clearInterval(tick);return}
  if(Q.paused||Q.left<=0)return;
  Q.left--;
  if(Q.left<=5&&Q.left>0)beep(990,.07);
  if(Q.left===0){beep(220,.5);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}drawQ();return}
  const R=33,C=2*Math.PI*R,arc=$("#arc"),s=$("#secs");
  if(arc){arc.setAttribute("stroke-dashoffset",C*(1-Q.left/total()));if(Q.left<=10){arc.setAttribute("stroke","var(--red)");$(".ring").classList.add("low")}}
  if(s)s.textContent=Q.left},1000)}
function pauseT(){if(!Q||Q.revealed)return;Q.paused=!Q.paused;drawQ()}
function useAid(id){const t=game.teams[Q.team];if(t.aids[id])return;t.aids[id]=true;
  if(id==="double")Q.double=true;if(id==="two")Q.two=true;if(id==="time"){Q.extra+=30;Q.left+=30}
  save();drawQ();beep(1200,.1)}
function reveal(){Q.revealed=true;clearInterval(tick);drawQ();beep(520,.15)}
function award(i){
  const x=game.cats[Q.ci].tiles[Q.ti];
  if(i!==null){game.teams[i].score+=(Q.double&&i===Q.team)?x.p*2:x.p;beep(1320,.2)}
  x.done=true;x.by=i;game.turn=(game.turn+1)%game.teams.length;
  closeQ(true);
  if(game.cats.every(c=>c.tiles.every(t=>t.done))){game.over=true;save();go("end")}
}
function closeQ(s){clearInterval(tick);const el=$("#qv");if(el)el.remove();document.body.style.overflow="";Q=null;if(s)save();render()}

function confirmEnd(){
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div><h3 style="font-size:24px">End this game?</h3><p>The current scores decide the winner.</p><div class="row"><button class="btn btn-ghost" id="mNo">Keep playing</button><button class="btn btn-primary" id="mYes">End game</button></div></div>`;
  document.body.appendChild(m);m.querySelector("#mNo").onclick=()=>m.remove();
  m.querySelector("#mYes").onclick=()=>{m.remove();game.over=true;save();go("end")};
}
function endHTML(){
  const order=game.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score),tie=order.length>1&&order[0].score===order[1].score;
  setTimeout(confetti,50);
  return `<div class="sadu"></div><div class="screen end"><span class="label">Final scores</span><h1>${tie?"It's a tie":esc(order[0].name)+" wins"}</h1>
   <div class="rank">${order.map((t,k)=>`<div class="${k===0&&!tie?"first":""}" style="--c:${COLORS[t.i]}"><span>${k+1}. ${esc(t.name)}</span><span>${t.score}</span></div>`).join("")}</div>
   <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="btn btn-primary" onclick="startGame()">Rematch, new questions</button><button class="btn btn-ghost" onclick="go('setup')">Change setup</button></div></div>`;
}
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const b=document.createElement("div");b.className="confetti";const cols=["#C8352E","#E6A23C","#3A9D6F","#F5ECDD"];for(let k=0;k<80;k++){const i=document.createElement("i");i.style.left=Math.random()*100+"%";i.style.background=cols[k%4];i.style.transform="rotate(45deg)";i.style.animationDuration=(2+Math.random()*2.5)+"s";i.style.animationDelay=Math.random()*.8+"s";b.appendChild(i)}document.body.appendChild(b);setTimeout(()=>b.remove(),5200)}
function go(v){view=v;render()}
render();
</script>
