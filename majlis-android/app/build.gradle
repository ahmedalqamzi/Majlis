plugins { id 'com.android.application' }
android {
    namespace 'com.majlis.trivia'
    compileSdk 34
    defaultConfig {
        applicationId 'com.majlis.trivia'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'html' }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
