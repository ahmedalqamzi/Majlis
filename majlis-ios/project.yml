# XcodeGen spec: `xcodegen generate` in this folder writes Majlis.xcodeproj (CI does this; the project is not committed).
name: Majlis
options:
  bundleIdPrefix: com.ahmedalqamzi
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Majlis:
    type: application
    platform: iOS
    sources:
      - Majlis
      # Reusable native runtime (Engine/HTTP/Server/Support), shared
      # unchanged with the macOS CLI build (party/native/build.sh).
      # main.swift is the CLI entry point (stdin bridge, CLI arg parsing,
      # SIGTERM/SIGINT handling for a long-running process) and is excluded
      # per the L02A brief: iOS uses PartyHost.swift (Majlis/Party) as its
      # own entry point instead. MAJLIS_TEST_LOOPBACK-gated code inside the
      # shared files (SecureRandom.failForTesting, the stdin #csprng-fail
      # control line, the reference wire API) is excluded by *not* defining
      # that flag for this target (see settings.base below), not by a
      # separate exclude list — it's already behind #if in those files.
      - path: ../party/native/Sources
        excludes: ["main.swift"]
      # Generated by gen_embedded_sources.sh (prebuildScripts, below) at
      # every build: the reviewed JS embedded as base64 Swift source. The
      # committed placeholder keeps the repo buildable/greppable before the
      # first build phase runs.
      - path: ../party/native/gen
        name: Generated
      # Exact production player surface only (play.html + the JS/CSS it
      # imports), curated by gen_ios_web_resources.sh — never party/web
      # directly, which also holds operator/display pages and the
      # sim/tests harness trees the brief requires excluded from the app
      # target.
      - path: PartyWeb
        type: folder
      # The exact two accepted content packs (party/content/who_am_i.json,
      # feud.json), curated by gen_ios_content_packs.sh with a sha256
      # MANIFEST.txt — never party/content's full tree, and production-only
      # like PartyWeb above (this target has no debug/dev-content
      # counterpart to separate it from). PartyHost.swift's
      # `implementedModes` is the authority on which modes are bundled.
      - path: PartyContent
        type: folder
    prebuildScripts:
      - name: Generate embedded party sources
        script: |
          "$SRCROOT/../party/native/gen_embedded_sources.sh" "$SRCROOT/../party/native/gen/EmbeddedSources.swift"
        outputFiles:
          - "$SRCROOT/../party/native/gen/EmbeddedSources.swift"
      - name: Generate party web resources
        script: |
          "$SRCROOT/../party/native/gen_ios_web_resources.sh" "$SRCROOT/PartyWeb"
        outputFiles:
          - "$SRCROOT/PartyWeb/MANIFEST.txt"
      - name: Generate party content packs
        script: |
          "$SRCROOT/../party/native/gen_ios_content_packs.sh" "$SRCROOT/PartyContent"
        outputFiles:
          - "$SRCROOT/PartyContent/MANIFEST.txt"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedalqamzi.majlis
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Majlis
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        # Local-network usage: a party room binds a listener on the
        # device's Wi-Fi address so other phones on the same network can
        # join (see majlis-ios/Majlis/Party/PartyHost.swift). Worded to
        # describe what the app does, not to claim this guarantees a
        # system prompt — whether iOS shows the Local Network permission
        # dialog for an inbound NWListener (vs. only for outbound
        # Bonjour/mDNS browsing, which this app does not use) is one of
        # the physical-device items the L02A brief lists as open for L02B.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Majlis uses your Wi-Fi network so other players' phones can join a party game room you host."
